<script>/* src/engine/model.js */
/* =====================================================================
   SłupStal – model obliczeniowy słupa i analiza statyczna
   • geometria (wysokość H), warunki podparcia w dwóch płaszczyznach:
     „y” – zginanie M_y względem osi y–y (przemieszczenie w w kierunku z),
     „z” – zginanie M_z względem osi z–z (przemieszczenie v w kierunku y);
   • stężenia pośrednie (blokada przemieszczeń w płaszczyźnie y / z,
     na wysokości pasa lub środka ścinania, opcjonalnie skrętne);
   • obciążenia (przypadki): siły podłużne z mimośrodami, siły poziome,
     obciążenia rozłożone poziome, momenty skupione, ciężar własny;
   • siatka MES, analiza I rzędu przypadków (superpozycja) oraz analiza
     II rzędu kombinacji z imperfekcjami (przechyłową φ, łukową e₀).
   Jednostki wewnętrzne: N, mm.  Dane: kN, m, kNm, kN/m.
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, F = BS.FE;
const S = BS.S = {};

S.RODZAJE = {
  G: { n: 'stałe (G)', stale: true },
  Q: { n: 'użytkowe (Q)', psiKey: c => c.kat || 'Q-B' },
  S: { n: 'śnieg (S)', psiKey: () => 'S' },
  W: { n: 'wiatr (W)', psiKey: () => 'W' },
  T: { n: 'temperatura (T)', psiKey: () => 'T' },
  M: { n: 'dźwignice / maszyny (M)', psiKey: () => 'M' },
  Qc: { n: 'montażowe (Qc)', psiKey: () => 'Qc' },
  A: { n: 'wyjątkowe (A)', wyj: true }
};
S.PLN = { y: 'płaszczyzna x–z (zginanie M_y, wyboczenie względem osi y–y)', z: 'płaszczyzna x–y (zginanie M_z, wyboczenie względem osi z–z)' };
S.PLS = { y: 'x–z (M_y)', z: 'x–y (M_z)' };
S.DOL = { utw: 'utwierdzenie', prz: 'przegub', spr: 'przegub + sprężyna obrotowa' };
S.GORA = { swob: 'swobodny (wspornik)', prz: 'przegub nieprzesuwny', utw: 'utwierdzenie nieprzesuwne', utwp: 'utwierdzenie przesuwne (obrót zablokowany)', spr: 'podparcie sprężyste poziome' };
S.SKRET_D = { widelki: 'widełkowe (φ = 0, deplanacja swobodna)', pelne: 'pełne (φ = 0, φ′ = 0 – deplanacja zablokowana)' };
S.SKRET_G = { widelki: 'widełkowe (φ = 0)', swob: 'swobodne (koniec nieskręcony nie jest zapewniony)', pelne: 'pełne (φ = 0, φ′ = 0)' };

const kN = 1e3, m2mm = 1e3, kNm = 1e6;
const isSet = v => v !== '' && v !== null && v !== undefined && isFinite(+v);

/* ---------------------------------------------------------------- budowa modelu */
S.model = function (st, sec) {
  const md = { err: [], warn: [] };
  const H = U.num(st.geom.H) * m2mm;
  if (!(H > 100)) { md.err.push('Wysokość słupa musi być dodatnia (H > 0,1 m).'); return md; }
  md.H = H;
  const pod = st.podpory || {}, dol = pod.dol || {}, gora = pod.gora || {};
  md.bc = { dol: { y: dol.y || 'utw', z: dol.z || 'utw', kry: U.num(dol.kry, 0) * kNm, krz: U.num(dol.krz, 0) * kNm, skret: dol.skret || 'widelki' },
            gora: { y: gora.y || 'swob', z: gora.z || 'swob', khy: U.num(gora.khy, 0), khz: U.num(gora.khz, 0), skret: gora.skret || 'widelki' } };
  // stężenia pośrednie
  md.stez = (st.stezenia || []).map((z, i) => ({ i, x: U.num(z.x) * m2mm, pl: z.pl || 'z', skret: !!z.skret, wys: z.wys || 'srodek' }))
    .filter(z => z.x > 1 && z.x < H - 1).sort((a, b) => a.x - b.x);
  // przypadki obciążeń
  const cases = [];
  const sw = st.ciezarWlasny || {};
  if (sw.auto !== false) {
    const g = sec.gk * (1 + U.num(sw.dodatek, 0) / 100);    // kN/m ≡ N/mm
    cases.push({ id: 'G0', c: { id: 'G₀', nazwa: `ciężar własny słupa (${U.fmt(sec.masa, 1)} kg/m${U.num(sw.dodatek, 0) ? ` + ${U.fmt(U.num(sw.dodatek), 0)}% na blachy i łączniki` : ''})`, rodzaj: 'G', auto: true }, parts: [{ typ: 'Nq', q: g, x0: 0, x1: H }] });
  }
  (st.obciazenia || []).forEach((o, i) => {
    if (o.aktywne === false) return;
    const parts = [];
    (o.sklad || []).forEach(p => {
      if (p.typ === 'N') {
        const x = isSet(p.x) ? U.clamp(U.num(p.x) * m2mm, 0, H) : H;
        parts.push({ typ: 'N', x, F: U.num(p.F) * kN, ey: U.num(p.ey, 0), ez: U.num(p.ez, 0) });
      } else if (p.typ === 'H') {
        const x = isSet(p.x) ? U.clamp(U.num(p.x) * m2mm, 0, H) : H;
        parts.push({ typ: 'H', x, kier: p.kier === 'y' ? 'y' : 'z', F: U.num(p.F) * kN, wys: p.wys || 'srodek' });
      } else if (p.typ === 'q') {
        const x0 = isSet(p.x0) ? U.clamp(U.num(p.x0) * m2mm, 0, H) : 0, x1 = isSet(p.x1) ? U.clamp(U.num(p.x1) * m2mm, 0, H) : H;
        if (x1 - x0 < 1) return;
        const q0 = U.num(p.q0), q1 = isSet(p.q1) ? U.num(p.q1) : q0;
        parts.push({ typ: 'q', kier: p.kier === 'y' ? 'y' : 'z', q0, q1, x0, x1, wys: p.wys || 'srodek' });
      } else if (p.typ === 'M') {
        const x = isSet(p.x) ? U.clamp(U.num(p.x) * m2mm, 0, H) : H;
        parts.push({ typ: 'M', x, os: p.os === 'z' ? 'z' : 'y', M: U.num(p.M) * kNm });
      } else if (p.typ === 'Nq') {
        const x0 = isSet(p.x0) ? U.num(p.x0) * m2mm : 0, x1 = isSet(p.x1) ? U.num(p.x1) * m2mm : H;
        parts.push({ typ: 'Nq', q: U.num(p.q), x0, x1 });
      }
    });
    cases.push({ id: 'L' + i, idx: i, c: o, parts });
  });
  md.cases = cases;
  // siatka: węzły obowiązkowe
  const keys = [0, H];
  md.stez.forEach(z => keys.push(z.x));
  cases.forEach(c => c.parts.forEach(p => { if (p.x !== undefined) keys.push(p.x); if (p.x0 !== undefined) keys.push(p.x0, p.x1); }));
  md.xs = F.mesh(keys, H, H / 48);
  md.ne = md.xs.length - 1;
  md.xm = []; for (let e = 0; e < md.ne; e++) md.xm.push((md.xs[e] + md.xs[e + 1]) / 2);
  // podpory w płaszczyznach (statyka)
  md.sup = { y: S.supports(md, 'y', false), z: S.supports(md, 'z', false) };
  md.supNS = { y: S.supports(md, 'y', true), z: S.supports(md, 'z', true) };
  const kr0 = (pl) => (pl === 'y' ? md.bc.dol.kry : md.bc.dol.krz);
  const baseRot = (pl) => md.bc.dol[pl] === 'utw' || (md.bc.dol[pl] === 'spr' && kr0(pl) > 0);
  const hasBrace = (pl) => md.stez.some(z => z.pl === pl || z.pl === 'yz');
  ['y', 'z'].forEach(pl => { const b = md.bc; if (!baseRot(pl) && (b.gora[pl] === 'swob' || b.gora[pl] === 'utwp' || (b.gora[pl] === 'spr' && !((pl === 'y' ? b.gora.khz : b.gora.khy) > 0))) && !hasBrace(pl)) md.err.push(`Płaszczyzna ${S.PLS[pl]}: układ geometrycznie zmienny – przy przesuwnym końcu górnym podstawa musi być utwierdzona (lub sprężysta z k > 0).`); });
  ['y', 'z'].forEach(pl => { const b = md.bc; if (b.dol[pl] === 'spr' && !(kr0(pl) > 0)) md.warn.push(`Płaszczyzna ${S.PLS[pl]}: sprężyna obrotowa podstawy k = 0 – przyjęto przegub.`); });
  md.sway = { y: S.isSway(md, 'y'), z: S.isSway(md, 'z') };
  return md;
};

/* tryb przechyłowy: koniec górny przesuwny i brak stężeń w płaszczyźnie */
S.isSway = (md, pl) => ['swob', 'utwp', 'spr'].includes(md.bc.gora[pl]) && !md.stez.some(z => z.pl === pl || z.pl === 'yz');

/* podpory dla F.col2 / F.buck2; ns = true – koniec górny unieruchomiony poziomo (postać nieprzechyłowa) */
S.supports = function (md, pl, ns) {
  const b = md.bc, H = md.H, out = [];
  const d = b.dol[pl], g = b.gora[pl];
  out.push({ x: 0, id: 'A', kv: 'fix', kr: d === 'utw' ? 'fix' : d === 'spr' ? (pl === 'y' ? b.dol.kry : b.dol.krz) : 0 });
  let top = null;
  if (g === 'prz') top = { kv: 'fix', kr: 0 };
  else if (g === 'utw') top = { kv: 'fix', kr: 'fix' };
  else if (g === 'utwp') top = { kv: ns ? 'fix' : 0, kr: 'fix' };
  else if (g === 'spr') { const k = pl === 'y' ? b.gora.khz : b.gora.khy; top = { kv: ns ? 'fix' : k, kr: 0 }; }
  else if (ns) top = { kv: 'fix', kr: 0 };
  if (top) out.push(Object.assign({ x: H, id: 'B' }, top));
  md.stez.filter(z => z.pl === pl || z.pl === 'yz').forEach((z, i) => out.push({ x: z.x, id: 'S' + (i + 1), kv: 'fix', kr: 0, brace: true }));
  return out;
};

/* obciążenia przypadku w płaszczyźnie: { dist, point, mom } oraz N na elementach */
S.planeLoads = function (md, c, pl) {
  const o = { dist: [], point: [], mom: [] };
  c.parts.forEach(p => {
    if (p.typ === 'N') { const e = pl === 'y' ? p.ez : p.ey; if (e) o.mom.push({ x: p.x, M: p.F * e }); }
    else if (p.typ === 'H' && p.kier === (pl === 'y' ? 'z' : 'y')) o.point.push({ x: p.x, P: p.F });
    else if (p.typ === 'q' && p.kier === (pl === 'y' ? 'z' : 'y')) o.dist.push({ x0: p.x0, x1: p.x1, q0: p.q0, q1: p.q1 });
    else if (p.typ === 'M' && p.os === pl) o.mom.push({ x: p.x, M: p.M });
  });
  return o;
};
S.axial = function (md, c) {
  const Nel = new Float64Array(md.ne);
  c.parts.forEach(p => {
    if (p.typ === 'N') { for (let e = 0; e < md.ne; e++) if (md.xm[e] < p.x) Nel[e] += p.F; }
    else if (p.typ === 'Nq') { for (let e = 0; e < md.ne; e++) { const xm = md.xm[e]; const a = Math.max(xm, p.x0), b = p.x1; if (b > a) Nel[e] += p.q * (b - a); } }
  });
  return Nel;
};

/* ---------------------------------------------------------------- analiza I rzędu przypadków */
S.analyze = function (md, sec) {
  const E = U.E;
  const an = { res: {}, xs3: null };
  md.cases.forEach(c => {
    const r = { c: c.c, Nel: S.axial(md, c), pl: {} };
    ['y', 'z'].forEach(pl => {
      const L = S.planeLoads(md, c, pl);
      const EI = E * (pl === 'y' ? sec.Iy : sec.Iz);
      const has = L.dist.length || L.point.length || L.mom.length;
      if (!has) { r.pl[pl] = null; return; }
      const res = F.col2(Object.assign({ xs: md.xs, EI, sup: md.sup[pl] }, L));
      if (res.err) throw new Error(`${S.PLS[pl]}: ${res.err}`);
      const sm = F.sample2(res);
      r.pl[pl] = { sm, reac: res.reactions, loads: L };
      if (!an.xs3) an.xs3 = sm.xs;
    });
    an.res[c.id] = r;
  });
  if (!an.xs3) { const xs3 = []; for (let e = 0; e < md.ne; e++) xs3.push(md.xs[e], md.xm[e], md.xs[e + 1]); an.xs3 = xs3; }
  an.ns = an.xs3.length;
  // N w punktach próbkowania (3 na element)
  an.N3 = (Nel) => { const o = new Float64Array(an.ns); for (let e = 0; e < md.ne; e++) { o[3 * e] = o[3 * e + 1] = o[3 * e + 2] = Nel[e]; } return o; };
  return an;
};

/* ---------------------------------------------------------------- kombinacja: I rząd (superpozycja) */
S.combine1 = function (md, an, combo) {
  const ns = an.ns, z = () => new Float64Array(ns);
  const o = { Nel: new Float64Array(md.ne), y: { M: z(), V: z(), w: z(), R: { A: { R: 0, M: 0 }, B: { R: 0, M: 0 } } }, z: { M: z(), V: z(), w: z(), R: { A: { R: 0, M: 0 }, B: { R: 0, M: 0 } } } };
  combo.terms.forEach(t => {
    const r = an.res[t.id]; if (!r) return;
    for (let e = 0; e < md.ne; e++) o.Nel[e] += t.f * r.Nel[e];
    ['y', 'z'].forEach(pl => {
      const p = r.pl[pl]; if (!p) return;
      const a = o[pl];
      for (let i = 0; i < ns; i++) { a.M[i] += t.f * p.sm.M[i]; a.V[i] += t.f * p.sm.V[i]; a.w[i] += t.f * p.sm.w[i]; }
      p.reac.forEach(q => { if (!a.R[q.id]) a.R[q.id] = { R: 0, M: 0 }; a.R[q.id].R += t.f * q.R; a.R[q.id].M += t.f * q.M; });
    });
  });
  o.N = an.N3(o.Nel);
  o.order = 1;
  return o;
};

/* obciążenia kombinacji w płaszczyźnie (do analizy II rzędu i Mcr) */
S.comboLoads = function (md, an, combo, pl) {
  const L = { dist: [], point: [], mom: [] };
  combo.terms.forEach(t => {
    const r = an.res[t.id]; if (!r || !r.pl[pl]) return;
    const q = r.pl[pl].loads;
    q.dist.forEach(d => L.dist.push({ x0: d.x0, x1: d.x1, q0: t.f * d.q0, q1: t.f * d.q1 }));
    q.point.forEach(p => L.point.push({ x: p.x, P: t.f * p.P }));
    q.mom.forEach(p => L.mom.push({ x: p.x, M: t.f * p.M }));
  });
  return L;
};

/* ---------------------------------------------------------------- imperfekcje */
// φ = φ0·αh·αm (5.3.2(3)); h – wysokość słupa [m]
S.phiSway = function (md, ndp, imp) {
  const h = md.H / 1000;
  const ah = U.clamp(2 / Math.sqrt(h), 2 / 3, 1), m = Math.max(1, Math.round(U.num(imp.m, 1))), am = Math.sqrt(0.5 * (1 + 1 / m));
  const phi0 = U.num(ndp.phi0, 1 / 200);
  const auto = phi0 * ah * am;
  const man = isSet(imp.phi) && +imp.phi > 0 ? 1 / U.num(imp.phi) : null;   // podane jako 1/φ (np. 200)
  return { phi0, ah, am, m, h, auto, phi: man !== null ? man : auto, manual: man !== null };
};
// e0/L wg tabl. 5.1 (analiza sprężysta)
S.E0L = { a0: 350, a: 300, b: 250, c: 200, d: 150 };
// segmenty łuku: między punktami blokady przemieszczenia w płaszczyźnie (podpory, stężenia); górny swobodny – do wierzchołka
S.bowSegments = function (md, pl) {
  const pts = new Set([0]);
  const g = md.bc.gora[pl];
  if (g === 'prz' || g === 'utw') pts.add(md.H);
  md.stez.filter(z => z.pl === pl || z.pl === 'yz').forEach(z => pts.add(z.x));
  const xs = Array.from(pts).sort((a, b) => a - b);
  const segs = [];
  for (let i = 1; i < xs.length; i++) segs.push({ x0: xs[i - 1], x1: xs[i] });
  const last = xs[xs.length - 1];
  if (last < md.H - 1) segs.push({ x0: last, x1: md.H, free: true });
  return segs;
};
// wektor d0 (w, θ w węzłach): przechył φ·x (sgn) + łuki e0 (sgnB) w segmentach
S.d0 = function (md, pl, phi, e0L, sgn, sgnB, segs) {
  const xs = md.xs, d0 = new Float64Array(2 * xs.length);
  const sw = phi && md.sway[pl] ? phi * sgn : 0;
  xs.forEach((x, i) => { d0[2 * i] += sw * x; d0[2 * i + 1] += sw; });
  if (e0L) (segs || S.bowSegments(md, pl)).forEach((s, k) => {
    const Ls = s.x1 - s.x0, e0 = Ls / e0L * (Array.isArray(sgnB) ? sgnB[k] : sgnB);
    xs.forEach((x, i) => {
      if (x < s.x0 - 1e-6 || x > s.x1 + 1e-6) return;
      const t = (x - s.x0) / Ls;
      // łuk półfalowy; dla odcinka wspornikowego – ćwiartka fali (wygięcie rośnie ku swobodnemu końcowi) dodawana do łuku
      d0[2 * i] += e0 * Math.sin(Math.PI * t); d0[2 * i + 1] += e0 * Math.PI / Ls * Math.cos(Math.PI * t);
    });
  });
  return d0;
};

/* ---------------------------------------------------------------- kombinacja: II rząd z imperfekcjami */
// o: { phi, e0L: {y, z}, var: { pl: 'y'|'z', s: ±1 } – płaszczyzna i zwrot imperfekcji przechyłowej, sgnB: { y, z } }
S.combine2 = function (md, an, sec, combo, o) {
  const E = U.E, ns = an.ns;
  const c1 = S.combine1(md, an, combo);
  const out = { Nel: c1.Nel, N: c1.N, order: 2, imp: { phi: {}, e0: {} } };
  for (const pl of ['y', 'z']) {
    const L = S.comboLoads(md, an, combo, pl);
    const EI = E * (pl === 'y' ? sec.Iy : sec.Iz);
    const swayHere = o.var && o.var.pl === pl ? o.phi : 0;
    const e0L = o.e0L ? o.e0L[pl] : 0;
    const sB = o.sgnB && o.sgnB[pl] !== undefined ? o.sgnB[pl] : (o.var ? o.var.s : 1);
    const d0 = S.d0(md, pl, swayHere, e0L, o.var && o.var.pl === pl ? o.var.s : 1, sB);
    const res = F.col2(Object.assign({ xs: md.xs, EI, sup: md.sup[pl], Nel: c1.Nel, d0 }, L));
    if (res.err) { out.err = `${S.PLS[pl]}: ${res.err}`; out[pl] = c1[pl]; continue; }
    const sm = F.sample2(res);
    const R = {}; res.reactions.forEach(q => { R[q.id] = { R: q.R, M: q.M }; });
    out[pl] = { M: Float64Array.from(sm.M), V: Float64Array.from(sm.V), w: Float64Array.from(sm.w), R };
    out.imp.phi[pl] = swayHere && md.sway[pl] ? swayHere * (o.var.s || 1) : 0;
    out.imp.e0[pl] = e0L ? sB : 0;
  }
  void ns;
  return out;
};

/* ---------------------------------------------------------------- pomocnicze */
S.at = function (xs, arr, x) {
  // wartość w x (pierwsze trafienie od lewej; przy skoku – wartość „z dołu”)
  for (let i = 1; i < xs.length; i++) if (x <= xs[i] + 1e-9) { const x0 = xs[i - 1], x1 = xs[i]; if (x1 - x0 < 1e-9) return arr[i]; return arr[i - 1] + (arr[i] - arr[i - 1]) * (x - x0) / (x1 - x0); }
  return arr[arr.length - 1];
};
S.maxAbs = function (arr, xs, x0, x1) { let m = 0, im = -1; for (let i = 0; i < arr.length; i++) { if (xs && (xs[i] < x0 - 1e-6 || xs[i] > x1 + 1e-6)) continue; if (Math.abs(arr[i]) > Math.abs(m)) { m = arr[i]; im = i; } } return { v: m, i: im, x: im >= 0 && xs ? xs[im] : null }; };

})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/engine/kombinacje.js */
/* =====================================================================
   SłupStal – kombinacje oddziaływań wg PN-EN 1990 (zał. A1)
   SGN STR: 6.10 lub mniej korzystna z 6.10a i 6.10b, obciążenia stałe
   jako niekorzystne (γG,sup) i korzystne (γG,inf) – jednolite źródło;
   zmienne – wszystkie podzbiory z wyborem wiodącego, grupy wykluczające
   się (np. kierunki wiatru); sytuacja wyjątkowa 6.11b, pożarowa (6.11b
   z ψ1,1 lub ψ2,1), SGU: charakterystyczna 6.14b, częsta 6.15b,
   quasi-stała 6.16b, kombinacja do doboru stali (PN-EN 1993-1-10, 2.2(5)).
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, N = BS.N, S = BS.S;
const K = BS.K = {};

K.psi = function (c) {
  if (Array.isArray(c.psi) && c.psi.length === 3 && c.psi.every(v => v !== '' && v !== null && isFinite(+v))) return c.psi.map(Number);
  const R = S.RODZAJE[c.rodzaj];
  if (!R || !R.psiKey) return [1, 1, 1];
  const e = N.PSI[R.psiKey(c)];
  return e ? e.p.slice() : [1, 1, 1];
};
const fmtF = (f) => U.fmt(f, 3).replace(/,?0+$/, '').replace(/,$/, '');

K.generate = function (md, ndp, opt) {
  opt = opt || {};
  const out = [], warn = [];
  const kfi = +ndp.KFI || 1;
  const gS = ndp.gG_sup * kfi, gI = ndp.gG_inf, gQ = ndp.gQ * kfi, xi = ndp.xi;
  const seen = new Set();
  const push = (c) => {
    const key = c.typ + '|' + c.terms.map(t => t.id + '=' + t.f.toFixed(5)).sort().join(';');
    if (seen.has(key)) return; seen.add(key);
    c.id = c.typ + (out.filter(o => o.typ === c.typ).length + 1);
    out.push(c);
  };
  const byId = {}; md.cases.forEach(c => { byId[c.id] = c; });
  const Gc = md.cases.filter(c => S.RODZAJE[c.c.rodzaj] && S.RODZAJE[c.c.rodzaj].stale).map(c => c.id);
  const Ac = md.cases.filter(c => c.c.rodzaj === 'A').map(c => c.id);
  const Vc = md.cases.filter(c => S.RODZAJE[c.c.rodzaj] && !S.RODZAJE[c.c.rodzaj].stale && c.c.rodzaj !== 'A').map(c => c.id);
  const slots = [], grp = {};
  Vc.forEach(k => { const w = (byId[k].c.wyklucz || '').trim(); if (w) { if (!grp[w]) { grp[w] = []; slots.push(grp[w]); } grp[w].push(k); } else slots.push([k]); });
  let choices = [[]];
  const total = slots.reduce((p, sl) => p * (sl.length + 1), 1);
  if (total <= 512) slots.forEach(sl => { const nx = []; choices.forEach(ch => { nx.push(ch); sl.forEach(k => nx.push(ch.concat([k]))); }); choices = nx; });
  else {
    warn.push(`${slots.length} niezależnych oddziaływań zmiennych – ograniczono przegląd podzbiorów (wszystkie razem, pojedynczo, bez zmiennych).`);
    choices = [[]]; slots.forEach(sl => sl.forEach(k => choices.push([k])));
    choices.push(slots.map(sl => sl[0]));
  }
  const lbl = (k) => byId[k].c.id;
  const mk = (typ, gf, lead, acc, accF, leadF, form, sit) => {
    const terms = Gc.map(k => ({ id: k, f: gf }));
    if (lead) terms.push({ id: lead, f: leadF });
    acc.forEach((k, i) => { if (accF[i] > 0) terms.push({ id: k, f: accF[i] }); });
    const ps = [];
    if (Gc.length) ps.push(fmtF(gf) + '·G');
    if (lead) ps.push(fmtF(leadF) + '·' + lbl(lead));
    acc.forEach((k, i) => { if (accF[i] > 0) ps.push(fmtF(accF[i]) + '·' + lbl(k)); });
    return { typ, forma: form, gf, lead: lead || null, terms, sytuacja: sit || (typ === 'SGN' ? 'trwała' : typ), opis: (form ? form + ': ' : '') + (ps.join(' + ') || '—') };
  };
  const psi = (k) => K.psi(byId[k].c);
  const pf = (k) => (ndp.psiAcc === 'psi2' ? psi(k)[2] : psi(k)[1]);
  choices.forEach(ch => {
    // ---- SGN (STR) – obciążenia stałe niekorzystne i korzystne
    [gS, gI].forEach(gf => {
      if (!ch.length) { push(mk('SGN', gf, null, [], [], 0, ndp.komb === '6.10' ? '6.10' : '6.10a')); return; }
      if (ndp.komb === '6.10') ch.forEach(L => { const acc = ch.filter(k => k !== L); push(mk('SGN', gf, L, acc, acc.map(k => gQ * psi(k)[0]), gQ, '6.10')); });
      else {
        push(mk('SGN', gf, null, ch, ch.map(k => gQ * psi(k)[0]), 0, '6.10a'));
        ch.forEach(L => { const acc = ch.filter(k => k !== L); push(mk('SGN', gf === gS ? xi * gS : gI, L, acc, acc.map(k => gQ * psi(k)[0]), gQ, '6.10b')); });
      }
    });
    // ---- SGU
    if (!ch.length) { push(mk('char', 1, null, [], [], 0, '6.14b')); push(mk('czest', 1, null, [], [], 0, '6.15b')); push(mk('qp', 1, null, [], [], 0, '6.16b')); push(mk('kruche', 1, null, [], [], 0, 'PN-EN 1993-1-10, 2.2(5)')); }
    ch.forEach(L => {
      const acc = ch.filter(k => k !== L);
      push(mk('char', 1, L, acc, acc.map(k => psi(k)[0]), 1, '6.14b'));
      push(mk('czest', 1, L, acc, acc.map(k => psi(k)[2]), psi(L)[1], '6.15b'));
      push(mk('kruche', 1, L, acc, acc.map(k => psi(k)[2]), psi(L)[1], 'PN-EN 1993-1-10, 2.2(5)'));
    });
    if (ch.length) push(mk('qp', 1, null, ch, ch.map(k => psi(k)[2]), 0, '6.16b'));
    // ---- pożar
    if (opt.pozar) {
      if (!ch.length) push(mk('poz', 1, null, [], [], 0, '6.11b (pożar)', 'pożarowa'));
      ch.forEach(L => { const acc = ch.filter(k => k !== L); push(mk('poz', 1, L, acc, acc.map(k => psi(k)[2]), pf(L), '6.11b (pożar)', 'pożarowa')); });
    }
    // ---- wyjątkowa
    Ac.forEach(A => {
      const base = (L, acc, accF, lf) => { const c = mk('wyj', 1, L, acc, accF, lf, '6.11b', 'wyjątkowa'); c.terms.push({ id: A, f: 1 }); c.opis = c.opis.replace('6.11b: ', '6.11b: ' + lbl(A) + ' + '); return c; };
      if (!ch.length) push(base(null, [], [], 0));
      ch.forEach(L => { const acc = ch.filter(k => k !== L); push(base(L, acc, acc.map(k => psi(k)[2]), pf(L))); });
    });
  });
  return { list: out, warn };
};

})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>/* src/engine/statecznosc.js */
/* =====================================================================
   SłupStal – stateczność słupa (PN-EN 1993-1-1, 5.2, 6.3)
   • obciążenia krytyczne z MES dla rzeczywistego rozkładu N(x):
     wyboczenie giętne w obu płaszczyznach (postać przechyłowa
     i nieprzechyłowa), skrętne i giętno-skrętne (teoria Własowa),
     α_cr (5.2.1), długości wyboczeniowe L_cr = π·√(EI/N_cr);
   • moment krytyczny M_cr z MES (u, φ) dla rozkładu M_y kombinacji,
     z wysokością przyłożenia obciążeń poziomych i stężeniami;
   • χ, χ_T, χ_LT (6.3.1, 6.3.2.2 / 6.3.2.3 z f, k_c), współczynniki
     C_m (zał. B, tabl. B.3; zał. A, tabl. A.2), interakcja 6.61/6.62
     z k_ij wg zał. A (metoda 1) lub zał. B (metoda 2);
   • metoda ogólna 6.3.4 (α_ult,k, α_cr,op, χ_op).
   Ręczne nadpisania: L_cr, krzywe, M_cr, C_m, k_c.
   ===================================================================== */
(function (root) {
'use strict';
const BS = root.BS, U = BS.U, F = BS.FE, S = BS.S, R = BS.R;
const T = BS.T = {};
const ALPHA = { a0: 0.13, a: 0.21, b: 0.34, c: 0.49, d: 0.76 };
T.ALPHA = ALPHA;
const isSet = v => v !== '' && v !== null && v !== undefined && isFinite(+v) && +v > 0;

T.phi = (lam, al) => 0.5 * (1 + al * (lam - 0.2) + lam * lam);
T.chi = (lam, al) => { if (lam <= 0.2) return 1; const ph = T.phi(lam, al); return Math.min(1, 1 / (ph + Math.sqrt(Math.max(0, ph * ph - lam * lam)))); };

/* krzywe wyboczeniowe – tabl. 6.2 */
T.curveFlex = function (sec, fy) {
  if (sec.kind === 'CC') return { y: 'c', z: 'c', why: 'ceowniki (tabl. 6.2: przekroje U) – gałęzie słupa złożonego' };
  if (sec.kind === 'RHS' || sec.kind === 'CHS') {
    if (sec.wyk === 'zimn') return { y: 'c', z: 'c', why: 'kształtownik zamknięty formowany na zimno' };
    return fy >= 460 ? { y: 'a0', z: 'a0', why: 'kształtownik zamknięty gorąco wykończony, S460' } : { y: 'a', z: 'a', why: 'kształtownik zamknięty gorąco wykończony' };
  }
  const hb = sec.h / Math.max(sec.bg, sec.bd), tf = Math.max(sec.tg, sec.td);
  if (sec.typ === 'walc') {
    if (fy >= 460) { if (hb > 1.2) return tf <= 40 ? { y: 'a0', z: 'a0', why: 'walcowany, h/b > 1,2, t_f ≤ 40 mm, S460' } : { y: 'a', z: 'a', why: 'walcowany, h/b > 1,2, 40 < t_f ≤ 100 mm, S460' }; return tf <= 100 ? { y: 'a', z: 'a', why: 'walcowany, h/b ≤ 1,2, t_f ≤ 100 mm, S460' } : { y: 'c', z: 'c', why: 'walcowany, h/b ≤ 1,2, t_f > 100 mm, S460' }; }
    if (hb > 1.2) return tf <= 40 ? { y: 'a', z: 'b', why: `walcowany, h/b = ${U.fmt(hb, 2)} > 1,2, t_f ≤ 40 mm` } : { y: 'b', z: 'c', why: `walcowany, h/b > 1,2, 40 < t_f ≤ 100 mm` };
    return tf <= 100 ? { y: 'b', z: 'c', why: `walcowany, h/b = ${U.fmt(hb, 2)} ≤ 1,2, t_f ≤ 100 mm` } : { y: 'd', z: 'd', why: 'walcowany, h/b ≤ 1,2, t_f > 100 mm' };
  }
  return tf <= 40 ? { y: 'b', z: 'c', why: 'dwuteownik spawany, t_f ≤ 40 mm' } : { y: 'c', z: 'd', why: 'dwuteownik spawany, t_f > 40 mm' };
};
/* krzywe zwichrzenia – tabl. 6.4 (6.3.2.2) i 6.5 (6.3.2.3) */
T.curveLT = function (sec, met) {
  if (sec.kind !== 'I') return 'd';
  const hb = sec.h / Math.min(sec.bg, sec.bd);
  if (met === '6.3.2.3') return sec.typ === 'walc' ? (hb <= 2 ? 'b' : 'c') : (hb <= 2 ? 'c' : 'd');
  return sec.typ === 'walc' ? (hb <= 2 ? 'a' : 'b') : (hb <= 2 ? 'c' : 'd');
};
T.chiLT = function (lam, MEd, Mcr, sec, ndp, kc, met, curveOv) {
  const curve = curveOv || T.curveLT(sec, met), al = ALPHA[curve];
  const o = { met, curve, alLT: al, lam, kc };
  if (met === '6.3.2.3') {
    const l0 = +ndp.lamLT0, be = +ndp.betaLT;
    o.lam0 = l0; o.beta = be;
    if (lam <= l0 || Math.abs(MEd) / Mcr <= l0 * l0) { o.skip = true; o.chi = 1; o.f = 1; o.chimod = 1; return o; }
    const ph = 0.5 * (1 + al * (lam - l0) + be * lam * lam);
    o.phi = ph; o.chi = Math.min(1, 1 / lam / lam, 1 / (ph + Math.sqrt(Math.max(0, ph * ph - be * lam * lam))));
    o.f = Math.min(1, 1 - 0.5 * (1 - kc) * (1 - 2 * Math.pow(lam - 0.8, 2)));
    o.chimod = Math.min(1, 1 / lam / lam, o.chi / o.f);
  } else {
    o.lam0 = 0.2; o.beta = 1;
    if (lam <= 0.2 || Math.abs(MEd) / Mcr <= 0.04) { o.skip = true; o.chi = 1; o.f = 1; o.chimod = 1; return o; }
    const ph = 0.5 * (1 + al * (lam - 0.2) + lam * lam);
    o.phi = ph; o.chi = Math.min(1, 1 / (ph + Math.sqrt(Math.max(0, ph * ph - lam * lam)))); o.f = 1; o.chimod = o.chi;
  }
  return o;
};

/* ---------------------------------------------------------------- kształt wykresu momentów w odcinku */
T.shape = function (xs, M, x0, x1, hasDist, hasPt) {
  const at = (x) => S.at(xs, M, x);
  const ma = at(x0 + 1e-6), mb = at(x1 - 1e-6);
  let dev = 0, mmax = 0, xmax = x0, mabs = 0;
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i]; if (x < x0 - 1e-6 || x > x1 + 1e-6) continue;
    const lin = ma + (mb - ma) * (x - x0) / Math.max(1e-9, x1 - x0);
    dev = Math.max(dev, Math.abs(M[i] - lin));
    if (Math.abs(M[i]) > mabs) { mabs = Math.abs(M[i]); mmax = M[i]; xmax = x; }
  }
  const linear = dev <= 0.02 * Math.max(mabs, 1);
  const Mh = Math.abs(ma) >= Math.abs(mb) ? ma : mb, Mo = Math.abs(ma) >= Math.abs(mb) ? mb : ma;
  const psi = Math.abs(Mh) > 1e-9 ? U.clamp(Mo / Mh, -1, 1) : 1;
  let Ms = (ma + mb) / 2; if (!linear) Ms = mmax;
  return { ma, mb, linear, psi, Mh, Ms, Mmax: mmax, xmax, mabs, conc: !!hasPt && !hasDist, x0, x1 };
};
/* C_m wg tabl. B.3 */
T.CmB = function (sh) {
  const psi = sh.psi, conc = sh.conc;
  if (sh.mabs < 1) return { v: 1, f: 'brak momentu' };
  if (sh.linear) return { v: Math.max(0.4, 0.6 + 0.4 * psi), f: `0,6 + 0,4ψ ≥ 0,4; ψ = ${U.fmt(psi, 3)}` };
  const Mh = sh.Mh, Ms = sh.Ms;
  if (Math.abs(Ms) < Math.abs(Mh)) {
    const as = Ms / Mh;
    if (as >= 0) return { v: Math.max(0.4, 0.2 + 0.8 * as), f: `0,2 + 0,8α_s ≥ 0,4; α_s = M_s/M_h = ${U.fmt(as, 3)}` };
    if (psi >= 0) return conc ? { v: Math.max(0.4, -0.8 * as), f: `−0,8α_s ≥ 0,4; α_s = ${U.fmt(as, 3)} (obciążenie skupione)` } : { v: Math.max(0.4, 0.1 - 0.8 * as), f: `0,1 − 0,8α_s ≥ 0,4; α_s = ${U.fmt(as, 3)} (obciążenie równomierne)` };
    return conc ? { v: Math.max(0.4, 0.2 * (-psi) - 0.8 * as), f: `0,2(−ψ) − 0,8α_s ≥ 0,4; ψ = ${U.fmt(psi, 3)}, α_s = ${U.fmt(as, 3)}` } : { v: Math.max(0.4, 0.1 * (1 - psi) - 0.8 * as), f: `0,1(1 − ψ) − 0,8α_s ≥ 0,4; ψ = ${U.fmt(psi, 3)}, α_s = ${U.fmt(as, 3)}` };
  }
  const ah = Math.abs(Ms) > 1e-9 ? Mh / Ms : 0;
  if (ah >= 0 || psi >= 0) return conc ? { v: 0.90 + 0.10 * ah, f: `0,90 + 0,10α_h; α_h = M_h/M_s = ${U.fmt(ah, 3)}` } : { v: 0.95 + 0.05 * ah, f: `0,95 + 0,05α_h; α_h = M_h/M_s = ${U.fmt(ah, 3)}` };
  return conc ? { v: 0.90 + 0.10 * ah * (1 + 2 * psi), f: `0,90 + 0,10α_h(1 + 2ψ); α_h = ${U.fmt(ah, 3)}, ψ = ${U.fmt(psi, 3)}` } : { v: 0.95 + 0.05 * ah * (1 + 2 * psi), f: `0,95 + 0,05α_h(1 + 2ψ); α_h = ${U.fmt(ah, 3)}, ψ = ${U.fmt(psi, 3)}` };
};
/* C_mi,0 wg tabl. A.2 */
T.CmA0 = function (sh, NEd, Ncr, EI, dx, L) {
  if (sh.mabs < 1) return { v: 1, f: 'brak momentu' };
  const r = NEd > 0 && isFinite(Ncr) ? NEd / Ncr : 0;
  if (sh.linear) return { v: 0.79 + 0.21 * sh.psi + 0.36 * (sh.psi - 0.33) * r, f: `0,79 + 0,21ψ + 0,36(ψ − 0,33)·N_Ed/N_cr; ψ = ${U.fmt(sh.psi, 3)}` };
  const k = Math.PI * Math.PI * EI * Math.abs(dx) / (L * L * sh.mabs);
  return { v: 1 + (k - 1) * r, f: `1 + (π²EI|δ_x|/(L²|M_Ed|) − 1)·N_Ed/N_cr; δ_x = ${U.fmt(Math.abs(dx), 2)} mm` };
};

/* ---------------------------------------------------------------- odcinki */
// granice odcinków w płaszczyźnie pl (stężenia blokujące przemieszczenie w tej płaszczyźnie)
T.segPlane = function (md, pl) {
  const pts = new Set([0, md.H]);
  md.stez.filter(z => z.pl === pl || z.pl === 'yz').forEach(z => pts.add(z.x));
  const xs = Array.from(pts).sort((a, b) => a - b);
  const o = []; for (let i = 1; i < xs.length; i++) if (xs[i] - xs[i - 1] > 1) o.push({ x0: xs[i - 1], x1: xs[i] });
  return o;
};
// odcinki zwichrzeniowe: między stężeniami bocznymi (płaszczyzna z) i skrętnymi
T.segLT = function (md) {
  const pts = new Set([0, md.H]);
  md.stez.filter(z => z.pl === 'z' || z.pl === 'yz' || z.skret).forEach(z => pts.add(z.x));
  const xs = Array.from(pts).sort((a, b) => a - b);
  const o = []; for (let i = 1; i < xs.length; i++) if (xs[i] - xs[i - 1] > 1) o.push({ x0: xs[i - 1], x1: xs[i], free: i === xs.length - 1 && md.bc.gora.z === 'swob' && md.bc.gora.skret === 'swob' });
  return o;
};

/* ---------------------------------------------------------------- warunki brzegowe Własowa */
T.restrZ = (sec, wys) => (wys === 'pas+' ? sec.h - (sec.tg || sec.t || 0) / 2 - sec.zs : wys === 'pas-' ? (sec.td || sec.t || 0) / 2 - sec.zs : 0);
T.heightOf = (sec, wys) => (wys === 'pas+' ? sec.h - sec.zs : wys === 'pas-' ? -sec.zs : 0);
T.bc3 = function (md, sec, ns) {
  const b = md.bc, H = md.H, bc = [], springs = [];  // więzy sztywne i sprężyny
  // podstawa: u, v = 0; obroty wg utwierdzenia; φ = 0; deplanacja wg warunku
  bc.push({ x: 0, u: true, v: true, du: b.dol.z === 'utw', dv: b.dol.y === 'utw', phi: true, dphi: b.dol.skret === 'pelne' });
  if (b.dol.z === 'spr' && b.dol.krz > 0) springs.push({ x: 0, kru: b.dol.krz });
  if (b.dol.y === 'spr' && b.dol.kry > 0) springs.push({ x: 0, krv: b.dol.kry });
  const top = { x: H };
  const tr = (g) => g === 'prz' || g === 'utw' || (ns && (g === 'swob' || g === 'utwp' || g === 'spr'));
  if (tr(b.gora.z)) top.u = true; if (tr(b.gora.y)) top.v = true;
  if (b.gora.z === 'utw' || b.gora.z === 'utwp') top.du = true; if (b.gora.y === 'utw' || b.gora.y === 'utwp') top.dv = true;
  if (b.gora.skret !== 'swob') top.phi = true; if (b.gora.skret === 'pelne') top.dphi = true;
  bc.push(top);
  if (!ns) {
    if (b.gora.z === 'spr' && b.gora.khy > 0) springs.push({ x: H, k: b.gora.khy, zr: 0 });
    if (b.gora.y === 'spr' && b.gora.khz > 0) springs.push({ x: H, kv: b.gora.khz });
  }
  md.stez.forEach(z => {
    if (z.pl === 'z' || z.pl === 'yz') springs.push({ x: z.x, k: 'rigid', zr: T.restrZ(sec, z.wys) });
    if (z.pl === 'y' || z.pl === 'yz') springs.push({ x: z.x, kv: 'rigid' });
    if (z.skret) springs.push({ x: z.x, kt: 'rigid' });
  });
  return { bc, springs };
};
T.ftBase = (md, sec) => ({ xs: md.xs, EIy: U.E * sec.Iy, EIz: U.E * sec.Iz, EIw: U.E * (sec.Iw || 0), GIt: U.G * sec.It, A: sec.A, Iy: sec.Iy, Iz: sec.Iz, y0: 0, z0: sec.z0 || 0, betaZ: sec.betaZ || 0, betaY: 0 });

/* ---------------------------------------------------------------- obciążenia krytyczne przy N(x) */
// cache: klucz – znormalizowany rozkład N
T.ncrAll = function (md, sec, Nel, ns, cache) {
  let Nmax = 0; for (let e = 0; e < md.ne; e++) Nmax = Math.max(Nmax, Nel[e]);
  if (!(Nmax > 1e-6)) return { Nmax: 0, y: { alpha: Infinity }, z: { alpha: Infinity }, T: { alpha: Infinity }, TF: { alpha: Infinity } };
  const key = (ns ? 'ns|' : 's|') + Array.from(Nel).map(v => Math.round(Math.max(0, v) / Nmax * 200)).join(',');
  if (cache && cache[key]) return Object.assign({ Nmax }, cache[key]);
  const Nn = Float64Array.from(Nel, v => Math.max(0, v) / Nmax);   // rozkład jednostkowy (N_max = 1)
  const o = {};
  ['y', 'z'].forEach(pl => {
    const r = F.buck2({ xs: md.xs, EI: U.E * (pl === 'y' ? sec.Iy : sec.Iz), Nel: Nn, sup: ns ? md.supNS[pl] : md.sup[pl] });
    o[pl] = { alpha: r.alpha, mode: r.mode, err: r.err };   // N_cr = α·N_max (α dla N_max = 1 N)
  });
  if (sec.kind === 'I') {
    const { bc, springs } = T.bc3(md, sec, ns);
    const b = T.ftBase(md, sec);
    const rT = F.ft(Object.assign({}, b, { fields: { u: false, v: false, phi: true }, Nel: Nn, bc, springs, z0: 0 }));
    o.T = { alpha: rT.lam, mode: rT.mode, err: rT.err };
    // postać sprzężona (u, φ): monosymetria lub stężenia przy pasie (wyboczenie względem osi wymuszonej)
    const rTF = F.ft(Object.assign({}, b, { fields: { u: true, v: false, phi: true }, Nel: Nn, bc, springs }));
    o.TF = { alpha: rTF.lam, mode: rTF.mode, err: rTF.err };
    // N_cr,T obliczone ze środka ścinania z i0² (z0 ≠ 0 uwzględnione w TF)
  } else { o.T = { alpha: Infinity, closed: true }; o.TF = { alpha: Infinity, closed: true }; }
  if (cache) cache[key] = o;
  return Object.assign({ Nmax }, o);
};

/* moment krytyczny: λ_cr dla rozkładu M_y kombinacji (I rząd), obciążenia poziome na wysokości e */
T.mcrRun = function (md, an, sec, combo, My1, cache, extra) {
  const xs3 = an.xs3;
  let mx = 0; for (let i = 0; i < My1.length; i++) mx = Math.max(mx, Math.abs(My1[i]));
  if (!(mx > 1e3)) return { lam: Infinity, none: true };
  // obciążenia w kierunku z z wysokością przyłożenia (parcie ku środkowi ścinania – destabilizujące)
  const qz = [], pz = [];
  combo.terms.forEach(t => {
    const c = md.cases.find(q => q.id === t.id); if (!c) return;
    c.parts.forEach(p => {
      if (p.kier !== 'z' || !(p.typ === 'q' || p.typ === 'H')) return;
      const e = T.heightOf(sec, p.wys); if (!e) return;
      if (p.typ === 'q') qz.push({ x0: p.x0, x1: p.x1, w0: -t.f * p.q0, w1: -t.f * p.q1, e });
      else pz.push({ x: p.x, P: -t.f * p.F, e });
    });
  });
  const key = Array.from(My1).map(v => Math.round(v / mx * 400)).join(',') + '|' + JSON.stringify(qz.map(q => [q.x0, q.x1, Math.round(q.w0 / mx * 1e9), Math.round(q.w1 / mx * 1e9), q.e])) + JSON.stringify(pz.map(p => [p.x, Math.round(p.P / mx * 1e9), p.e])) + (extra || '');
  if (cache && cache[key]) { const c = cache[key]; return { lam: c.lamN / mx, mode: c.mode, err: c.err, mx }; }
  const xs = md.xs, ne = md.ne;
  const Mfun = (e) => [S.at(xs3, My1, xs[e] + 1e-6), S.at(xs3, My1, (xs[e] + xs[e + 1]) / 2), S.at(xs3, My1, xs[e + 1] - 1e-6)];
  const qe = [];
  for (let e = 0; e < ne; e++) {
    const xa = xs[e], xb = xs[e + 1], xm = (xa + xb) / 2, arr = [];
    qz.forEach(d => { if (xm > d.x0 && xm < d.x1) { const L = d.x1 - d.x0; arr.push({ w0: d.w0 + (d.w1 - d.w0) * (xa - d.x0) / L, w1: d.w0 + (d.w1 - d.w0) * (xb - d.x0) / L, e: d.e }); } });
    qe.push(arr);
  }
  const { bc, springs } = T.bc3(md, sec, false);
  const r = F.ft(Object.assign({}, T.ftBase(md, sec), { fields: { u: true, v: false, phi: true }, Mye: Mfun, qz: (e) => qe[e], ptz: pz, bc, springs }));
  if (cache) cache[key] = { lamN: r.lam * mx, mode: r.mode, err: r.err };
  return { lam: r.lam, mode: r.mode, err: r.err, mx };
};
// M_cr,0 – moment stały w odcinku (do λ̄0 zał. A i C1)
T.mcrUniform = function (md, sec, sg, cache) {
  const key = 'U|' + sg.x0 + '|' + sg.x1;
  if (cache && cache[key]) return cache[key];
  const xs = md.xs, M0 = 1e6;
  const { bc, springs } = T.bc3(md, sec, false);
  const Mfun = (e) => { const xm = (xs[e] + xs[e + 1]) / 2; return xm > sg.x0 && xm < sg.x1 ? [M0, M0, M0] : [0, 0, 0]; };
  const r = F.ft(Object.assign({}, T.ftBase(md, sec), { fields: { u: true, v: false, phi: true }, Mye: Mfun, bc, springs }));
  const v = { Mcr0: r.lam * M0, err: r.err };
  if (cache) cache[key] = v;
  return v;
};
// C1 odcinka na podporach widełkowych (do k_c = 1/√C1)
T.C1seg = function (sec, sg, xs3, My, cache) {
  const Ls = sg.x1 - sg.x0, xs = F.mesh([sg.x0, sg.x1], sg.x1, Ls / 24).filter(x => x >= sg.x0 - 1e-6);
  let mx = 0; xs.forEach(x => { mx = Math.max(mx, Math.abs(S.at(xs3, My, x))); });
  if (!(mx > 0)) return 1;
  const key = 'C1|' + sg.x0 + '|' + sg.x1 + '|' + xs.map(x => Math.round(S.at(xs3, My, x) / mx * 400)).join(',');
  if (cache && cache[key]) return cache[key];
  const Mfun = (e) => [S.at(xs3, My, xs[e] + 1e-6), S.at(xs3, My, (xs[e] + xs[e + 1]) / 2), S.at(xs3, My, xs[e + 1] - 1e-6)];
  const bc = [{ x: sg.x0, u: true, phi: true }, { x: sg.x1, u: true, phi: true }];
  const r = F.ft({ xs, EIy: U.E * sec.Iy, EIz: U.E * sec.Iz, EIw: U.E * sec.Iw, GIt: U.G * sec.It, A: sec.A, Iy: sec.Iy, Iz: sec.Iz, betaZ: 0, fields: { u: true, v: false, phi: true }, Mye: Mfun, bc });
  const Mcr0 = Math.PI / Ls * Math.sqrt(U.E * sec.Iz * U.G * sec.It * (1 + Math.PI * Math.PI * U.E * sec.Iw / (Ls * Ls * U.G * sec.It)));
  const C1 = Math.max(1, r.lam * mx / Mcr0);
  if (cache) cache[key] = C1;
  return C1;
};

/* ---------------------------------------------------------------- sprawdzenie elementu (6.3.1–6.3.3) */
/* c: { md, an, sec, base, ndp, st, combo, Fd (siły obliczeniowe: N, y.M, z.M), F1 (I rząd – kształty, δ), method, cache, mcr }
   zwraca { flex: {y, z}, tors, segs: [ … interakcja … ] } */
T.member = function (c) {
  const { md, an, sec, base, ndp, st, combo, Fd, F1, method } = c;
  const fy = base.fy, g1 = ndp.gM1, E = U.E, G = U.G;
  const ov = (st.analiza && st.analiza.nadp) || {};
  const xs3 = an.xs3;
  const fl = T.curveFlex(sec, fy);
  const Aeff = base.Aeff, NRk = Aeff * fy;
  const ns = method === 'II_glob';
  // --- obciążenia krytyczne
  const nc = c.ncr || T.ncrAll(md, sec, Fd.Nel, ns, c.cache.ncr);
  const Nmax = nc.Nmax;
  const flex = {};
  ['y', 'z'].forEach(pl => {
    const I = pl === 'y' ? sec.Iy : sec.Iz, EI = E * I;
    const o = { pl, curve: (ov['krz' + pl.toUpperCase()] && ov['krz' + pl.toUpperCase()] !== 'auto') ? ov['krz' + pl.toUpperCase()] : fl[pl], curveAuto: fl[pl], curveWhy: fl.why };
    const Lov = isSet(ov['Lcr' + pl.toUpperCase()]) ? U.num(ov['Lcr' + pl.toUpperCase()]) * 1000 : null;
    const muOv = isSet(ov['mu' + pl.toUpperCase()]) ? U.num(ov['mu' + pl.toUpperCase()]) : null;
    if (method === 'II_pelna') { o.Ncr = Infinity; o.Lcr = 0; o.src = 'imperfekcje łukowe e₀ w analizie II rzędu – wyboczenie giętne ujęte w analizie (5.2.2(3)a)'; o.covered = true; }
    else if (Lov) { o.Lcr = Lov; o.Ncr = Math.PI * Math.PI * EI / (Lov * Lov); o.src = 'L_cr przyjęte ręcznie'; o.manual = true; }
    else if (muOv) { o.Lcr = muOv * md.H; o.Ncr = Math.PI * Math.PI * EI / (o.Lcr * o.Lcr); o.src = `μ = ${U.fmt(muOv, 2)} przyjęte ręcznie (L_cr = μ·H)`; o.manual = true; o.mu = muOv; }
    else {
      const a = nc[pl] ? nc[pl].alpha : Infinity;
      o.alpha = a;
      o.Ncr = Nmax > 0 ? a : Infinity;            // wartość własna dla rozkładu N(x) z N_max = 1 N → N_cr = α [N] (w przekroju z N_max)
      o.Lcr = isFinite(o.Ncr) ? Math.PI * Math.sqrt(EI / o.Ncr) : Infinity;
      o.mu = o.Lcr / md.H;
      o.src = ns ? 'MES – postać nieprzechyłowa (koniec górny unieruchomiony; przechył ujęty w analizie II rzędu z φ)' : 'MES – obciążenie krytyczne dla rozkładu N(x) kombinacji';
      o.mode = nc[pl] && nc[pl].mode; o.err = nc[pl] && nc[pl].err;
    }
    o.alphaCr = Nmax > 0 && isFinite(o.Ncr) ? o.Ncr / Nmax : Infinity;
    o.lam = isFinite(o.Ncr) && o.Ncr > 0 ? Math.sqrt(NRk / o.Ncr) : 0;
    o.lamE = isFinite(o.Lcr) && o.Lcr > 0 ? o.Lcr / Math.sqrt(I / sec.A) : 0;     // smukłość λ = L_cr/i
    o.chi = method === 'II_pelna' ? 1 : T.chi(o.lam, ALPHA[o.curve]);
    o.phi = T.phi(o.lam, ALPHA[o.curve]);
    o.NbRd = o.chi * NRk / g1;
    if (pl === 'z' && sec.bu) {
      // słup złożony z przewiązkami / przekładkami w rozstawie > 15 i_min – wyboczenie względem osi niematerialnej wg 6.4 (siła w gałęzi);
      // w interakcji 6.61/6.62 χ_z = 1 (stateczność gałęzi sprawdzana osobno)
      o.bu = true; o.chiStd = o.chi; o.chi = 1; o.NbRd = NRk / g1;
      o.src = (o.src || '') + ' · oś niematerialna – sprawdzenie gałęzi wg 6.4';
    }
    flex[pl] = o;
  });
  // --- skrętne i giętno-skrętne (przekroje otwarte)
  const tors = { relevant: sec.kind === 'I' || (sec.kind === 'CC' && !sec.bu) };
  if (tors.relevant) {
    const i02 = (sec.Iy + sec.Iz) / sec.A + (sec.z0 || 0) ** 2;
    tors.i02 = i02;
    if (isSet(ov.LcrT)) {
      const LT = U.num(ov.LcrT) * 1000; tors.LcrT = LT; tors.manual = true;
      tors.NcrT = (G * sec.It + Math.PI * Math.PI * E * sec.Iw / (LT * LT)) / i02;
      if (Math.abs(sec.z0) > 1e-6) { const Nz = flex.z.Ncr, bt = 1 - sec.z0 * sec.z0 / i02, a = Nz + tors.NcrT; tors.NcrTF = (a - Math.sqrt(a * a - 4 * bt * Nz * tors.NcrT)) / (2 * bt); }
      else tors.NcrTF = Infinity;
      tors.src = 'L_cr,T przyjęte ręcznie';
    } else {
      tors.NcrT = Nmax > 0 ? nc.T.alpha : Infinity; tors.NcrTF = Nmax > 0 ? nc.TF.alpha : Infinity;
      tors.LcrT = isFinite(tors.NcrT) && tors.NcrT * i02 > G * sec.It ? Math.PI * Math.sqrt(E * sec.Iw / (tors.NcrT * i02 - G * sec.It)) : Infinity;
      tors.src = 'MES (teoria Własowa) – warunki skrętne końców i stężenia';
      tors.mode = nc.T && nc.T.mode;
    }
    tors.mono = Math.abs(sec.z0 || 0) > 1e-6;
    // N_cr,TF z analizy sprzężonej (u, φ) jest miarodajne, gdy jest mniejsze od N_cr,z (postać giętno-skrętna lub względem osi wymuszonej stężeniem przy pasie);
    // w przeciwnym razie postać sprzężona jest postacią giętną z–z, sprawdzaną osobno
    tors.tfGov = isFinite(tors.NcrTF) && tors.NcrTF < flex.z.Ncr * 0.995;
    tors.Ncr = tors.tfGov ? Math.min(tors.NcrT, tors.NcrTF) : tors.NcrT;
    tors.lam = isFinite(tors.Ncr) && tors.Ncr > 0 ? Math.sqrt(NRk / tors.Ncr) : 0;
    tors.curve = flex.z.curve;
    tors.chi = T.chi(tors.lam, ALPHA[tors.curve]);
    tors.NbRd = tors.chi * NRk / g1;
    tors.governs = method === 'II_pelna' ? tors.chi < 1 : tors.chi < flex.z.chi - 1e-9;
  }
  // --- zwichrzenie i interakcja w odcinkach zwichrzeniowych
  const ltbSus = sec.kind === 'I' || (sec.kind === 'CC' && !sec.bu);
  const met = sec.kind === 'I' && sec.sym ? (ndp.ltbMet || '6.3.2.3') : '6.3.2.2';
  const segs = T.segLT(md), segY = T.segPlane(md, 'y'), segZ = T.segPlane(md, 'z');
  const My = Fd.y.M, Mz = Fd.z.M, Nar = Fd.N;
  const My1 = F1.y.M, Mz1 = F1.z.M;
  const kNinterMet = (st.analiza && st.analiza.interMet && st.analiza.interMet !== 'ndp') ? st.analiza.interMet : (ndp.interMet || 'B');
  let mcr = null;
  if (ltbSus && !isSet(ov.Mcr)) mcr = T.mcrRun(md, an, sec, combo, My1, c.cache.mcr);
  const distIn = (pl, s) => combo.terms.some(t => { const q = md.cases.find(k => k.id === t.id); return q && q.parts.some(p => p.typ === 'q' && p.kier === (pl === 'y' ? 'z' : 'y') && p.x1 > s.x0 + 1 && p.x0 < s.x1 - 1); });
  const ptIn = (pl, s) => combo.terms.some(t => { const q = md.cases.find(k => k.id === t.id); return q && q.parts.some(p => ((p.typ === 'H' && p.kier === (pl === 'y' ? 'z' : 'y')) || (p.typ === 'M' && p.os === pl)) && p.x > s.x0 + 1 && p.x < s.x1 - 1); });
  const out = [];
  segs.forEach(sg => {
    let NEd = 0; for (let i = 0; i < xs3.length; i++) if (xs3[i] >= sg.x0 - 1e-6 && xs3[i] <= sg.x1 + 1e-6) NEd = Math.max(NEd, Nar[i]);
    const shY = T.shape(xs3, My, sg.x0, sg.x1), shZ = T.shape(xs3, Mz, sg.x0, sg.x1);
    const MyEd = shY.mabs, MzEd = shZ.mabs;
    if (NEd <= 1e-3 * base.Npl && MyEd < 1e3 && MzEd < 1e3) return;
    // klasa przy (N, M_y, M_z) odcinka
    const cx = R.ctx(sec, base, NEd, shY.Mmax || 0, shZ.Mmax || 0);
    const cls = cx.cls;
    const Wy = cls <= 2 ? sec.Wpl_y : cls === 3 ? Math.min(sec.Wel_t, sec.Wel_b) : (shY.Mmax >= 0 ? base.Wy : base.WyN);
    const Wz = cls <= 2 ? sec.Wpl_z : cls === 3 ? sec.Wel_z : base.Wz;
    const MyRk = Wy * fy, MzRk = Wz * fy;
    const dMy = cls === 4 ? Math.abs(NEd * (base.eNy || 0)) : 0;
    // M_cr i χ_LT
    let ltb = { chimod: 1, skip: true, none: true }, Mcr = Infinity, lamLT = 0, C1 = null, kc = 1, kcSrc = '';
    const sh1 = T.shape(xs3, My1, sg.x0, sg.x1);
    if (ltbSus && MyEd > 1e3) {
      if (isSet(ov.Mcr)) { Mcr = U.num(ov.Mcr) * 1e6; }
      else if (mcr && isFinite(mcr.lam)) Mcr = mcr.lam * Math.max(sh1.mabs, 1);
      else if (mcr && mcr.lam === Infinity) Mcr = Infinity;
      lamLT = isFinite(Mcr) ? Math.sqrt(MyRk / Mcr) : 0;
      if (met === '6.3.2.3') {
        if (isSet(ov.kc)) { kc = U.clamp(U.num(ov.kc), 0.5, 1); kcSrc = 'k_c przyjęte ręcznie'; }
        else if (ndp.kcMet === '1' || kNinterMet === 'A') { kc = 1; kcSrc = kNinterMet === 'A' ? 'k_c = 1 (zał. A: wpływ rozkładu momentu ujęty w C_mLT)' : 'k_c = 1 (przyjęto bezpiecznie, f = 1)'; }
        else if (sg.free) { kc = 1; kcSrc = 'k_c = 1 (odcinek wspornikowy – bezpiecznie)'; }
        else if (sh1.linear) { kc = Math.min(1, 1 / (1.33 - 0.33 * sh1.psi)); kcSrc = `tabl. 6.6: k_c = 1/(1,33 − 0,33ψ), ψ = ${U.fmt(sh1.psi, 3)}`; }
        else { try { C1 = T.C1seg(sec, sg, xs3, My1, c.cache.c1); kc = U.clamp(1 / Math.sqrt(C1), 0.6, 1); kcSrc = `k_c = 1/√C₁ ≥ 0,6, C₁ = ${U.fmt(C1, 3)} (MES odcinka na podporach widełkowych)`; } catch (e) { kc = 1; kcSrc = 'k_c = 1'; } }
      }
      const crv = ov.krzLT && ov.krzLT !== 'auto' ? ov.krzLT : null;
      ltb = T.chiLT(lamLT, MyEd, Mcr, sec, ndp, kc, met, crv);
      ltb.kcSrc = kcSrc;
    }

    // C_m
    const sgY = segY.find(s => sg.x0 >= s.x0 - 1 && sg.x1 <= s.x1 + 1) || { x0: 0, x1: md.H };
    const sgZ = segZ.find(s => sg.x0 >= s.x0 - 1 && sg.x1 <= s.x1 + 1) || { x0: sg.x0, x1: sg.x1 };
    const shCmy = T.shape(xs3, method === 'II_pelna' ? My : My, sgY.x0, sgY.x1, distIn('y', sgY), ptIn('y', sgY));
    const shCmz = T.shape(xs3, Mz, sgZ.x0, sgZ.x1, distIn('z', sgZ), ptIn('z', sgZ));
    const shCmLT = T.shape(xs3, My, sg.x0, sg.x1, distIn('y', sg), ptIn('y', sg));
    const swayY = method === 'I' && md.sway.y && !flex.y.manual, swayZ = method === 'I' && md.sway.z && !flex.z.manual;
    const fy1 = flex.y, fz1 = flex.z;
    const chiy = fy1.chi, chiz0 = fz1.chi;
    const chiz = tors.relevant && tors.governs ? Math.min(chiz0, tors.chi) : chiz0;
    const lamy = method === 'II_pelna' ? 0 : fy1.lam, lamz = method === 'II_pelna' || fz1.bu ? 0 : fz1.lam;
    const r = { sg, NEd, MyEd, MzEd, dMy, cls, Wy, Wz, MyRk, MzRk, NRk, chiy, chiz, chiz0, chiT: tors.relevant ? tors.chi : 1, lamy, lamz, Mcr, lamLT, ltb, chiLT, C1, kc, met, shY, shZ, sgY, sgZ, swayY, swayZ, xMy: shY.xmax, xMz: shZ.xmax };
    // ---- współczynniki C_m i k_ij
    const meth = kNinterMet;
    r.meth = meth;
    const gOv = (k) => (isSet(ov[k]) ? U.num(ov[k]) : null);
    if (meth === 'A') {
      const Ncry = fy1.Ncr, Ncrz = fz1.Ncr, NcrT = tors.relevant ? tors.NcrT : Infinity, NcrTF = tors.relevant ? tors.NcrTF : Infinity;
      const EIy = E * sec.Iy, EIz = E * sec.Iz;
      const dxy = T.chordDev(xs3, F1.y.w, sgY), dxz = T.chordDev(xs3, F1.z.w, sgZ);
      const sh1Y = T.shape(xs3, My1, sgY.x0, sgY.x1), sh1Z = T.shape(xs3, Mz1, sgZ.x0, sgZ.x1);
      const cmy0 = T.CmA0(sh1Y, NEd, Ncry, EIy, dxy, sgY.x1 - sgY.x0), cmz0 = T.CmA0(sh1Z, NEd, Ncrz, EIz, dxz, sgZ.x1 - sgZ.x0);
      const aLT = Math.max(0, 1 - sec.It / sec.Iy);
      let Mcr0 = Infinity; if (ltbSus && MyEd > 1e3) { const u0 = T.mcrUniform(md, sec, sg, c.cache.mcr); Mcr0 = u0.Mcr0; }
      const lam0 = isFinite(Mcr0) ? Math.sqrt(MyRk / Mcr0) : 0;
      const C1a = isFinite(Mcr0) && isFinite(Mcr) && Mcr0 > 0 ? Math.max(1, Mcr / Mcr0) : 1;
      const lim0 = 0.2 * Math.sqrt(C1a) * Math.pow(Math.max(0, (1 - NEd / Ncrz) * (1 - NEd / NcrTF)), 0.25);
      const epsY = NEd > 0 ? MyEd / NEd * (cls === 4 ? Aeff / Wy : sec.A / Math.min(sec.Wel_t, sec.Wel_b)) : Infinity;
      let Cmy, Cmz = cmz0.v, CmLT;
      if (lam0 <= lim0 || !ltbSus) { Cmy = cmy0.v; CmLT = 1; r.Afall = 'λ̄0 ≤ 0,2√C₁·⁴√[(1 − N_Ed/N_cr,z)(1 − N_Ed/N_cr,TF)] → C_my = C_my,0, C_mLT = 1'; }
      else {
        const se = Math.sqrt(isFinite(epsY) ? epsY : 1e6);
        Cmy = cmy0.v + (1 - cmy0.v) * se * aLT / (1 + se * aLT);
        CmLT = Math.max(1, Cmy * Cmy * aLT / Math.sqrt(Math.max(1e-9, (1 - NEd / Ncrz) * (1 - NEd / NcrT))));
        r.Afall = 'λ̄0 > 0,2√C₁·⁴√[…] → C_my = C_my,0 + (1 − C_my,0)√ε_y·a_LT/(1 + √ε_y·a_LT), C_mLT = C_my²·a_LT/√[(1 − N_Ed/N_cr,z)(1 − N_Ed/N_cr,T)] ≥ 1';

/* M_j,Rd wg tabl. 6.7 (N > 0 – rozciąganie; M ≥ 0) – symetryczna podstawa */

/* sprawdzenie dla sił u podstawy: f = { N (ściskanie +), My, Mz, Vy, Vz } */

J.passes = function (R, eta, scope) {
  if (!R) return false;
  if (R.errors.some(e => !(scope === 'sec' && /^Podstawa|^Model zakłada/.test(e)))) return false;
  const lim = (eta || 100) / 100 + 1e-9;
  return R.checks.every(c => {
    if (c.info) return true;
    if (scope === 'sec' && (/^Podstawa/.test(c.grp) || c.id === 'KRP')) return true;
    if (scope === 'base' && !/^Podstawa/.test(c.grp) && c.id !== 'KRP') return true;
    return c.util !== null && isFinite(c.util) && c.util <= lim;
  });

<script>/* src/ui/rysunki.js */

  s += gz('conc', `Fundament – beton ${esc(o.beton || '')}: kliknij – beton, wymiary fundamentu, k_j`, `<rect x="${XV(-lp / 2) - 20}" y="${yP + tpv + tgv}" width="${lp * scV + 40}" height="${60}" fill="#eef0f3" stroke="${C.mut}"/>`);
  s += gz('grout', 'Podlewka – kliknij: grubość t_g', `<rect x="${XV(-lp / 2)}" y="${yP + tpv}" width="${lp * scV}" height="${tgv}" fill="#d9dde3" stroke="${C.mut}" stroke-dasharray="3 2"/>`);
  s += gz('plate', 'Blacha podstawy – kliknij: wymiary, grubość, stal', `<rect x="${XV(-lp / 2)}" y="${yP}" width="${lp * scV}" height="${tpv}" fill="#b9c3d3" stroke="${C.ink}"/>`);
  const h2 = sec.h / 2, tf = sec.kind === 'I' ? sec.tg : sec.kind === 'CC' ? sec.tf : sec.t;
  s += gz('col', `Słup ${esc(sec.nazwa)} – kliknij: spoiny słupa z blachą`, `<rect x="${XV(-h2)}" y="${yP - 120}" width="${sec.h * scV}" height="120" fill="${C.steel}" fill-opacity="0.5" stroke="${C.ink}"/>`);
  if (sec.kind !== 'CHS') s += `<line x1="${XV(-h2 + tf)}" y1="${yP - 120}" x2="${XV(-h2 + tf)}" y2="${yP}" stroke="${C.ink}" stroke-width="0.8"/><line x1="${XV(h2 - tf)}" y1="${yP - 120}" x2="${XV(h2 - tf)}" y2="${yP}" stroke="${C.ink}" stroke-width="0.8"/>`;
  // spoiny
  let wl = '';
  [-h2, h2].forEach(z => { const sg = z > 0 ? 1 : -1, a = Math.max(3, C0.af * scV * 1.4); wl += `<path d="M${XV(z)},${yP} l${sg * a},0 l${-sg * a},${-a} z" fill="${C.ink}"/>`; });
  s += gz('weld', 'Spoiny słupa z blachą – kliknij: grubości a_f, a_w', wl + `<rect x="${XV(-h2) - 10}" y="${yP - 14}" width="20" height="16" fill="transparent"/><rect x="${XV(h2) - 10}" y="${yP - 14}" width="20" height="16" fill="transparent"/>`);
  let an2 = '';
  if (C0.uk === 'zew') [1, -1].forEach(sg => { const xx = XV(sg * C0.zT); an2 += `<line x1="${xx}" y1="${yP - 16}" x2="${xx}" y2="${yP + tpv + tgv + 56}" stroke="${C.red}" stroke-width="${Math.max(1.5, C0.d * scV)}"/><rect x="${xx - 6}" y="${yP - 10}" width="12" height="7" fill="${C.red}" fill-opacity="0.7"/>`; });

  s += Q.dimV(XV(lp / 2) + 26, yP, yP + tpv, `t<tspan baseline-shift="sub" font-size="75%">p</tspan> = ${fmt(tp, 0)}`, { right: true }) + tx(XV(lp / 2) + 26, yP + tpv + tgv + 12, `podlewka ${fmt(C0.tg, 0)}`, { fs: 9, a: 'start', c: C.mut });
  s += ed('podstawa.tp', XV(lp / 2) + 20, yP - 4, 40, tpv + 8, 'Grubość blachy t_p') + ed('podstawa.podlewka', XV(lp / 2) + 22, yP + tpv + tgv + 2, 70, 14, 'Grubość podlewki t_g');
  s += tx(XV(0), yP + tpv + tgv + 76, `beton ${esc(o.beton || '')}: f_jd = ${fmt(C0.fjd, 1)} MPa`.replace('_jd', '<tspan baseline-shift="sub" font-size="75%">jd</tspan>'), { fs: 9.5, c: C.ink2 });
  s += tx(8, Hh - 6, 'kliknij element – jego parametry; kliknij wymiar – zmiana wartości na rysunku; prawy przycisk – menu', { fs: 9, a: 'start', c: C.mut });
  return s + '</svg>';
};

/* ------------------------------------------------------------ pożar: θ(t) */
D.fire = function (fr, o) {
  o = o || {};
  const t = fr.hist.map(r => r[0]);
  return D.lineChart({ W: o.width || 640, H: o.height || 230, title: 'Temperatura gazów (ISO 834) i stali θ_a(t)', yl: 'θ [°C]', xl: 't [min]', dp: 0, xmin: 0,
    hl: [{ y: fr.thcr, c: C.warn, l: `θ_a,cr = ${fmt(fr.thcr, 0)} °C` }], vl: [{ x: fr.Rreq, l: 'R' + fr.Rreq }],
    series: [{ x: t, y: fr.hist.map(r => r[2]), c: C.red, dash: '5 3', l: 'gazy ISO 834' }, { x: t, y: fr.hist.map(r => r[1]), c: C.blu, l: 'stal θ_a' }] });
};

/* ------------------------------------------------------------ piktogram schematu (lista) */
D.pict = function (id) {
  const s = (BS.J.SCHEMATY || []).find(q => q.id === id); if (!s) return '';
  const W = 54, H = 46, cx1 = 15, cx2 = 39, y0 = 40, y1 = 6;
  const one = (cx, d, g) => `<line x1="${cx}" y1="${y0}" x2="${cx}" y2="${y1}" stroke="#1b2230" stroke-width="2"/>` + (d === 'utw' ? `<line x1="${cx - 6}" y1="${y0}" x2="${cx + 6}" y2="${y0}" stroke="#1b2230" stroke-width="2"/>` : `<path d="M${cx},${y0} l-4,5 h8 z" fill="#fff" stroke="#1b2230"/>`) + (g === 'prz' ? `<path d="M${cx},${y1} l-4,-4 h8 z" fill="#fff" stroke="#1b2230"/>` : g === 'utw' || g === 'utwp' ? `<line x1="${cx - 6}" y1="${y1}" x2="${cx + 6}" y2="${y1}" stroke="#1b2230" stroke-width="2"/>` : '');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${one(cx1, s.dol.y, s.gora.y)}${one(cx2, s.dol.z, s.gora.z)}<text x="${cx1}" y="${H}" font-size="7" text-anchor="middle">y</text><text x="${cx2}" y="${H}" font-size="7" text-anchor="middle">z</text></svg>`;
};

})();
