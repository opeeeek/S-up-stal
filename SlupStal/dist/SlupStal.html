        h += eq('k_{zy}', s.tab === 'B.1' ? (c12 ? '0,6·k_{yy}' : '0,8·k_{yy}') : (c12 ? (s.lamz < 0.4 ? '0,6 + λ̄_z ≤ 1 − 0,1λ̄_z·n_z/(C_{mLT} − 0,25)' : '[1 − 0,1λ̄_z·n_z/(C_{mLT} − 0,25)] ≥ [1 − 0,1n_z/(C_{mLT} − 0,25)]') : '[1 − 0,05λ̄_z·n_z/(C_{mLT} − 0,25)] ≥ [1 − 0,05n_z/(C_{mLT} − 0,25)]'), '', fm(s.kzy, 4), '', `tabl. ${s.tab}`);
      } else {
        h += line(`Zał. A: N<sub>cr,y</sub> = ${kN(mem.flex.y.Ncr)} kN, N<sub>cr,z</sub> = ${kN(mem.flex.z.Ncr)} kN${mem.tors.relevant ? `, N<sub>cr,T</sub> = ${kN(mem.tors.NcrT)} kN, N<sub>cr,TF</sub> = ${kN(mem.tors.NcrTF)} kN` : ''}`, 'tabl. A.1');
        h += eq('μ_y', '(1 − N_{Ed}/N_{cr,y})/(1 − χ_y·N_{Ed}/N_{cr,y})', '', fm(s.muy, 4)) + eq('μ_z', '(1 − N_{Ed}/N_{cr,z})/(1 − χ_z·N_{Ed}/N_{cr,z})', '', fm(s.muz, 4));
        h += eq('w_y', 'W_{pl,y}/W_{el,y} ≤ 1,5', '', fm(s.wy, 3)) + eq('w_z', 'W_{pl,z}/W_{el,z} ≤ 1,5', '', fm(s.wz, 3)) + eq('n_{pl}', 'N_{Ed}/(N_{Rk}/γ_{M1})', '', fm(s.npl, 4)) + eq('a_{LT}', '1 − I_t/I_y ≥ 0', '', fm(s.aLT, 4));
        h += eq('λ̄_0', '√(W_y·f_y/M_{cr,0}) (moment stały)', '', fm(s.lam0, 4)) + line(`C<sub>1</sub> = M<sub>cr</sub>/M<sub>cr,0</sub> = ${fm(s.C1a, 3)}; ${esc(s.Afall || '')}`, 'tabl. A.2');
        h += line(`C<sub>my,0</sub> = ${fm(s.cmy0.v, 4)} (${esc(s.cmy0.f)}); C<sub>mz,0</sub> = ${fm(s.cmz0.v, 4)} (${esc(s.cmz0.f)})`, 'tabl. A.2');
        h += line(`C<sub>my</sub> = <b>${fm(s.Cmy, 4)}</b>, C<sub>mz</sub> = <b>${fm(s.Cmz, 4)}</b>, C<sub>mLT</sub> = <b>${fm(s.CmLT, 4)}</b>${s.cmNote ? ' – ' + esc(s.cmNote) : ''}`, 'tabl. A.2');
        if (s.cls <= 2) h += line(`C<sub>yy</sub> = ${fm(s.Cyy, 4)}, C<sub>yz</sub> = ${fm(s.Cyz, 4)}, C<sub>zy</sub> = ${fm(s.Czy, 4)}, C<sub>zz</sub> = ${fm(s.Czz, 4)} (b<sub>LT</sub> = ${fm(s.bLT, 4)}, c<sub>LT</sub> = ${fm(s.cLT, 4)}, d<sub>LT</sub> = ${fm(s.dLT, 4)}, e<sub>LT</sub> = ${fm(s.eLT, 4)}, λ̄<sub>max</sub> = ${fm(s.lmax, 3)})`, 'tabl. A.1');
        h += eq('k_{yy}', s.cls <= 2 ? 'C_{my}C_{mLT}·μ_y/(1 − N_{Ed}/N_{cr,y})·1/C_{yy}' : 'C_{my}C_{mLT}·μ_y/(1 − N_{Ed}/N_{cr,y})', '', fm(s.kyy, 4), '', 'tabl. A.1');
        h += eq('k_{yz}', s.cls <= 2 ? 'C_{mz}·μ_y/(1 − N_{Ed}/N_{cr,z})·1/C_{yz}·0,6√(w_z/w_y)' : 'C_{mz}·μ_y/(1 − N_{Ed}/N_{cr,z})', '', fm(s.kyz, 4));
        h += eq('k_{zy}', s.cls <= 2 ? 'C_{my}C_{mLT}·μ_z/(1 − N_{Ed}/N_{cr,y})·1/C_{zy}·0,6√(w_y/w_z)' : 'C_{my}C_{mLT}·μ_z/(1 − N_{Ed}/N_{cr,y})', '', fm(s.kzy, 4));
        h += eq('k_{zz}', s.cls <= 2 ? 'C_{mz}·μ_z/(1 − N_{Ed}/N_{cr,z})·1/C_{zz}' : 'C_{mz}·μ_z/(1 − N_{Ed}/N_{cr,z})', '', fm(s.kzz, 4));
      }
      if (is61) h += eq('η_{6.61}', 'N_{Ed}/(χ_y·N_{Rk}/γ_{M1}) + k_{yy}·(M_{y,Ed} + ΔM_{y,Ed})/(χ_{LT}·M_{y,Rk}/γ_{M1}) + k_{yz}·M_{z,Ed}/(M_{z,Rk}/γ_{M1})', `${fm(s.tN_y, 4)} + ${fm(s.kyy, 4)}·${fm(s.tMy, 4)} + ${fm(s.kyz, 4)}·${fm(s.tMz, 4)}`, fm(s.u61, 4), '', '6.3.3 (6.61)');
      else h += eq('η_{6.62}', 'N_{Ed}/(χ_z·N_{Rk}/γ_{M1}) + k_{zy}·(M_{y,Ed} + ΔM_{y,Ed})/(χ_{LT}·M_{y,Rk}/γ_{M1}) + k_{zz}·M_{z,Ed}/(M_{z,Rk}/γ_{M1})', `${fm(s.tN_z, 4)} + ${fm(s.kzy, 4)}·${fm(s.tMy, 4)} + ${fm(s.kzz, 4)}·${fm(s.tMz, 4)}`, fm(s.u62, 4), '', '6.3.3 (6.62)');
      h += `<div class="eq">→ η = <b>${fm(c.util * 100, 1)}%</b>${okS(c.util)}</div>`;
      break;
    }
    case c.id === 'GM': {
      const g = d;
      h += head('Metoda ogólna (6.3.4)');
      h += line(`Kombinacja ${cmb(g.combo)}; siły w płaszczyźnie z analizy II rzędu z imperfekcjami w płaszczyźnie x–z.`);
      h += eq('α_{ult,k}', 'min mnożnik obciążeń do osiągnięcia nośności charakterystycznej przekroju (γ_{M0} = 1)', '', fm(g.aUlt, 3), '', `6.3.4(4), x = ${fm((g.at || 0) / 1000, 2)} m`);
      h += eq('α_{cr,op}', 'MES – postać z płaszczyzny (u, φ) przy N(x) i M_y(x)', '', fm(g.aCr, 3), '', '6.3.4(4)');
      h += eq('λ̄_{op}', '√(α_{ult,k}/α_{cr,op})', '', fm(g.lop, 4), '', '(6.64)');
      h += line(`χ<sub>z</sub>(λ̄<sub>op</sub>) = ${fm(g.chiZ, 4)} (krzywa ${g.curveZ}), χ<sub>LT</sub>(λ̄<sub>op</sub>) = ${fm(g.chiLT, 4)} (krzywa ${g.curveLT}, 6.3.2.2) → χ<sub>op</sub> = min = <b>${fm(g.chiOp, 4)}</b>`, '6.3.4(4)a');
      h += eq('χ_{op}·α_{ult,k}/γ_{M1}', '', `${fm(g.chiOp, 4)}·${fm(g.aUlt, 3)}/${fm(g1, 2)}`, fm(g.chiOp * g.aUlt / g1, 3), '', '(6.63)');
      h += `<div class="eq">→ η = γ<sub>M1</sub>/(χ<sub>op</sub>·α<sub>ult,k</sub>) = <b>${fm(c.util * 100, 1)}%</b>${okS(c.util)}</div>`;
      break;
    }
    case /^w[yz]$/.test(c.id): {
      h += head('Przemieszczenie poziome (SGU)');
      h += line(`kombinacja charakterystyczna ${cmb(d.combo)}; analiza ${d.order === 2 ? 'II rzędu (bez imperfekcji)' : 'I rzędu'}`);
      h += eq('w_{max}', '', '', fm(Math.abs(d.w), 2), 'mm', `x = ${fm((d.x || 0) / 1000, 2)} m`);
      h += eq('w_{lim}', `H/${fm(d.lim, 0)}`, `${fm(R.md.H, 0)}/${fm(d.lim, 0)}`, fm(d.wLim, 2), 'mm', 'PN-EN 1990 A1.4.3; ZK PN-EN 1993-1-1 7.2.2');
      h += verd(fm(Math.abs(d.w), 2), fm(d.wLim, 2), c.util, 'mm');
      break;
    }
    case /^PB/.test(c.id): h += RP.tokBase(c, R, S); break;
    case c.id === 'FI': h += RP.tokFire(c, R, S); break;
    case c.id === 'KR' || c.id === 'KRP': {
      const br = R.brittle || {};
      h += head(c.id === 'KR' ? 'Dobór stali ze względu na kruche pękanie – słup' : 'Dobór stali ze względu na kruche pękanie – blacha podstawy');
      if (c.id === 'KR') {
        h += line(`T<sub>Ed</sub> = T<sub>md</sub> + ΔT<sub>r</sub> + ΔT<sub>R</sub> = <b>${fm(br.TEd, 0)} °C</b>`, 'PN-EN 1993-1-10, 2.2(5)');
        h += line(`σ<sub>Ed</sub>/f<sub>y</sub>(t) = ${fm(br.rmax, 3)}${br.rmax < 0.25 ? ' < 0,25 → przyjęto 0,25' : ''} (kombinacja ${cmb(br.combo)})`, '2.2(4)');
        h += line(`tabl. 2.1 dla ${esc(R.mat.gatunek + R.mat.podgatunek)} (${esc(br.tm.key)}): t<sub>max</sub> = <b>${fm(br.tm.t, 0)} mm</b> (σ = 0,75/0,50/0,25 f<sub>y</sub>: ${fm(br.tm.v75, 0)} / ${fm(br.tm.v50, 0)} / ${fm(br.tm.v25, 0)} mm)`, 'tabl. 2.1');
        h += verd(fm(br.tCol, 1), fm(br.tm.t, 0), c.util, 'mm');
      } else { h += line(`t<sub>max</sub> (σ<sub>Ed</sub> = 0,75·f<sub>y</sub>, T<sub>Ed</sub> = ${fm(d.TEd, 0)} °C) = <b>${fm(d.tm.t, 0)} mm</b>`, 'tabl. 2.1'); h += verd(fm(c.Ed, 0), fm(d.tm.t, 0), c.util, 'mm'); }
      break;
    }
    default: h += line(sym(c.n));
  }
  return h;
};

/* ---------------------------------------------------------------- podstawa */
RP.tokBase = function (c, R, S) {
  const C = R.pb.C, ndp = R.ndp, d = c.d || {}, r = d.r || {}, fo = d.f || {};
  let h = `<h3>${sym(c.n)}</h3>`;
  if (d.f) h += line(`${cmb(fo.combo)}${fo.vr && R.method !== 'I' ? ' · ' + esc(fo.vr) : ''}: N<sub>Ed</sub> = ${kN(fo.N)} kN (+ ściskanie), M<sub>y,Ed</sub> = ${kNm(fo.My)} kNm, M<sub>z,Ed</sub> = ${kNm(fo.Mz)} kNm, V<sub>y,Ed</sub> = ${kN(fo.Vy)} kN, V<sub>z,Ed</sub> = ${kN(fo.Vz)} kN`);
  const fjd = () => eq('f_{cd}', 'α_{cc}·f_{ck}/γ_c', `${fm(ndp.acc, 2)}·${fm(C.fck, 0)}/${fm(ndp.gc, 2)}`, fm(C.fcd, 2), 'MPa', 'PN-EN 1992-1-1, 3.1.6') +
    (C.kjMan ? eq('k_j', '', '', fm(C.kj, 3), '', 'przyjęto ręcznie') : eq('k_j', '√(A_{c1}/A_{c0}) ≤ 3', `√(${fm(Math.max(C.a1, C.lp), 0)}·${fm(Math.max(C.b1, C.bp), 0)}/(${fm(C.lp, 0)}·${fm(C.bp, 0)}))`, fm(C.kj, 3), '', 'PN-EN 1992-1-1, 6.7')) +
    eq('f_{jd}', 'β_j·k_j·f_{cd}', `${fm(C.betaJ, 3)}·${fm(C.kj, 3)}·${fm(C.fcd, 2)}`, fm(C.fjd, 2), 'MPa', '6.2.5(7) (6.6)') +
    eq('c', 't_p·√(f_y/(3·f_{jd}·γ_{M0}))', `${fm(C.tp, 0)}·√(${fm(C.fyP, 0)}/(3·${fm(C.fjd, 2)}·${fm(ndp.gM0, 2)}))`, fm(C.c, 1), 'mm', '6.2.5(4) (6.5)');
  switch (c.id) {
    case 'PBN':
      h += fjd();
      if (C.kind === 'CHS') h += eq('A_{eff}', 'pierścień o szerokości t + 2c (ograniczony krawędziami blachy)', '', cm2(C.Aeff), 'cm²', '6.2.5(3)');
      else h += line(`Króciec pod pasem: b<sub>eff</sub> = ${fm(C.Tf.beff, 1)} mm, l<sub>eff</sub> = ${fm(C.Tf.leff, 1)} mm (×2); pod środnikiem: ${fm(C.Tw.beff, 1)} × ${fm(C.Tw.leff, 1)} mm`, '6.2.5(3), rys. 6.4') + eq('A_{eff}', '', '', cm2(C.Aeff), 'cm²');
      h += eq('N_{j,Rd}', 'A_{eff}·f_{jd}', `${cm2(C.Aeff)}·10²·${fm(C.fjd, 2)}`, kN(C.NjRd), 'kN', '6.2.5 (6.4), 6.2.8.2');
      h += verd(kN(r.N), kN(C.NjRd), c.util, 'kN');
      break;
    case 'PBNt': {
      const t = C.Tt;
      h += line(`Rozciąganie (wyrywanie): ${t.inner ? 'blacha między pasami – króciec z m = ' + fm(t.m, 1) + ' mm' : 'blacha wysięgu – króciec teowy z m<sub>x</sub> = ' + fm(t.mx, 1) + ' mm'}`, '6.2.6.11');
      h += eq('F_{t,Rd}', 'k_2·f_{ub}·A_s/γ_{M2}', `${fm(C.k2, 2)}·${fm(C.fub, 0)}·${fm(C.As, 0)}/${fm(ndp.gM2, 2)}`, kN(C.FtRd), 'kN', 'tabl. 3.4');
      h += eq('N_{t,Rd}', '', '', kN(r.NtRd), 'kN', `6.2.6.11 – ${esc(t.mode)}`);
      h += verd(kN(-r.N), kN(r.NtRd), c.util, 'kN');
      break;
    }
    case 'PBM': {
      const t = C.Tt, m = r.mjy;
      h += fjd();
      h += `<h3>Strona ściskana – króciec teowy pod pasem słupa</h3>`;
      h += line(`b<sub>eff</sub> = t<sub>f</sub> + c + min(c; …) = ${fm(C.Tf.beff, 1)} mm; l<sub>eff</sub> = b + 2·min(c; (b<sub>p</sub> − b)/2) = ${fm(C.Tf.leff, 1)} mm`, '6.2.5(3)');
      h += eq('F_{c,pl,Rd}', 'f_{jd}·b_{eff}·l_{eff}', `${fm(C.fjd, 2)}·${fm(C.Tf.beff, 1)}·${fm(C.Tf.leff, 1)}`, kN(C.FcplRd), 'kN', '6.2.5 (6.4)');
      h += eq('F_{c,fc,Rd}', 'M_{c,Rd}/(h − t_f)', `${kNm(R.base.Mcy)}/(${fm(C.h, 0)} − ${fm(C.tf, 1)})`, kN(C.FcfcRd), 'kN', '6.2.6.7 (6.21)');
      h += eq('F_{C,Rd}', 'min(F_{c,pl,Rd}; F_{c,fc,Rd})', '', kN(C.FC), 'kN', '6.2.8.3');
      h += `<h3>Strona rozciągana – blacha podstawy zginana i kotwy</h3>`;
      h += line(`Kotwy ${esc(C.kt.d)} kl. ${esc(C.kt.kl)} (${esc(C.kl.n)}): A<sub>s</sub> = ${fm(C.As, 0)} mm², f<sub>ub</sub> = ${fm(C.fub, 0)} MPa; rząd 2 kotew w rozstawie w = ${fm(C.w, 0)} mm, e = ${fm(t.e, 1)} mm, e<sub>x</sub> = ${fm(t.ex, 1)} mm`);
      h += eq('m_x', 'x − 0,8·a_f·√2', `${fm(t.x, 1)} − 0,8·${fm(C.af, 0)}·√2`, fm(t.mx, 2), 'mm', 'rys. 6.10');
      h += line(`l<sub>eff,cp</sub> = min(2πm<sub>x</sub>; πm<sub>x</sub> + w; πm<sub>x</sub> + 2e) = <b>${fm(t.lcp, 1)} mm</b>; l<sub>eff,nc</sub> = min(4m<sub>x</sub> + 1,25e<sub>x</sub>; e + 2m<sub>x</sub> + 0,625e<sub>x</sub>; 0,5b<sub>p</sub>; 0,5w + 2m<sub>x</sub> + 0,625e<sub>x</sub>) = <b>${fm(t.lnc, 1)} mm</b>`, 'tabl. 6.6 (wysięg blachy)');
      h += eq('l_{eff,1}', 'min(l_{eff,cp}; l_{eff,nc})', '', fm(t.leff1, 1), 'mm') + eq('M_{pl,1,Rd}', '0,25·Σl_{eff,1}·t_p²·f_y/γ_{M0}', `0,25·${fm(t.leff1, 1)}·${fm(C.tp, 0)}²·${fm(C.fyP, 0)}/${fm(ndp.gM0, 2)}`, kNm(t.Mpl1), 'kNm');
      h += eq('L_b', '8d + t_g + t_p + t_w + 0,5·m', '', fm(t.Lb, 1), 'mm', '6.2.6.12') + eq('L_b*', '8,8·m_x³·A_s·n_b/(Σl_{eff,1}·t_p³)', '', fm(t.LbStar, 1), 'mm', 'tabl. 6.2');
      h += line(t.prying ? 'L<sub>b</sub> ≤ L<sub>b</sub>* → mogą wystąpić siły dźwigni (postacie 1, 2, 3)' : 'L<sub>b</sub> > L<sub>b</sub>* → brak sił dźwigni (postać 1-2 i 3)', 'tabl. 6.2');
      h += eq('F_{t,Rd}', 'k_2·f_{ub}·A_s/γ_{M2}', `${fm(C.k2, 2)}·${fm(C.fub, 0)}·${fm(C.As, 0)}/${fm(ndp.gM2, 2)}`, kN(C.FtRd), 'kN', 'tabl. 3.4');
      if (t.prying) h += eq('F_{T,1,Rd}', '4M_{pl,1,Rd}/m_x', '', kN(t.FT1), 'kN') + eq('F_{T,2,Rd}', '(2M_{pl,2,Rd} + n·ΣF_{t,Rd})/(m_x + n)', '', kN(t.FT2), 'kN');
      else h += eq('F_{T,1-2,Rd}', '2M_{pl,1,Rd}/m_x', `2·${kNm(t.Mpl1)}·10⁶/${fm(t.mx, 2)}`, kN(t.FT12), 'kN', 'tabl. 6.2');
      h += eq('F_{T,3,Rd}', 'ΣF_{t,Rd}', `2·${kN(C.FtRd)}`, kN(t.FT3), 'kN');
      h += eq('F_{T,Rd}', 'min', '', kN(t.FTpl), 'kN', `6.2.6.11 – ${esc(t.mode)}`);
      h += `<h3>Nośność podstawy przy N + M</h3>`;
      h += line(`z<sub>T</sub> = ${fm(C.zT, 1)} mm (oś słupa → rząd kotew), z<sub>C</sub> = ${fm(C.zC, 1)} mm (oś słupa → środek pasa ściskanego)`, '6.2.8.3, rys. 6.18');
      if (m) {
        h += line(`e = M<sub>Ed</sub>/N<sub>Ed</sub> = ${isFinite(m.e) ? fm(m.e, 1) + ' mm' : '∞'} (N > 0 – rozciąganie); przypadek: <b>${esc(m.cas)}</b>, z = ${fm(m.z, 1)} mm`, 'tabl. 6.7');
        h += eq('M_{j,y,Rd}', m.f, `min(${kNm(m.a)}; ${isFinite(m.b) ? kNm(m.b) : '∞'})`, kNm(m.Mj), 'kNm', 'tabl. 6.7');
        h += eq('η_y', 'M_{y,Ed}/M_{j,y,Rd}', `${kNm(Math.abs(fo.My))}/${kNm(m.Mj)}`, fm(r.uMy, 3));
      }
      if (r.mjz) { h += line(`M<sub>z</sub>: model uproszczony (rozciągane 2 kotwy po stronie y, ściskanie pod krawędziami pasów): F<sub>T</sub> = ${kN(r.mjz.FT)} kN, F<sub>C</sub> = ${kN(r.mjz.FC)} kN, z<sub>T</sub> = ${fm(r.mjz.zT, 0)} mm, z<sub>C</sub> = ${fm(r.mjz.zC, 0)} mm → M<sub>j,z,Rd</sub> = <b>${kNm(r.mjz.Mj)} kNm</b>; interakcja liniowa M<sub>y</sub>/M<sub>j,y,Rd</sub> + M<sub>z</sub>/M<sub>j,z,Rd</sub> (założenie projektowe)`); h += eq('η', 'η_y + η_z', `${fm(r.uMy, 3)} + ${fm(r.uMz, 3)}`, fm(r.uM, 3)); }
      h += `<div class="eq">→ η = <b>${fm(c.util * 100, 1)}%</b>${okS(c.util)}</div>`;
      break;
    }
    case 'PBV':
      h += eq('F_{f,Rd}', 'C_{f,d}·N_{c,Ed}', `${fm(ndp.Cfd, 2)}·${kN(Math.max(0, r.N))}`, kN(r.FfRd), 'kN', '6.2.2(6) (6.1)');
      h += line(C.kotwyScin ? `kotwy przenoszą ścinanie (podkładki przyspawane / otwory normalne)` : 'kotwy nie przenoszą ścinania (otwory powiększone bez podkładek przyspawanych)');
      if (C.kotwyScin) { h += eq('α_{bc}', '0,44 − 0,0003·f_{yb}', `0,44 − 0,0003·${fm(C.fyb, 0)}`, fm(C.abc, 4), '', '6.2.2(7)') + eq('F_{2,vb,Rd}', 'α_{bc}·f_{ub}·A_s/γ_{M2}', '', kN(C.F2vb), 'kN', '(6.3)') + eq('F_{1,vb,Rd}', 'docisk blachy (tabl. 3.4)', '', kN(C.F1vb), 'kN') + eq('F_{vb,Rd}', 'min(F_{1,vb,Rd}; F_{2,vb,Rd})', '', kN(C.Fvb), 'kN'); }
      h += eq('F_{v,Rd}', 'F_{f,Rd} + n·F_{vb,Rd}', `${kN(r.FfRd)} + ${C.kotwyScin ? C.nb : 0}·${kN(C.Fvb)}`, kN(r.FvRd), 'kN', '6.2.2(8) (6.2)');
      h += verd(kN(r.V), kN(r.FvRd), c.util, 'kN');
      break;
    case 'PBTV':
      h += line(`siła rozciągająca na kotwę F<sub>t,Ed</sub> = ${kN(r.Ft1)} kN; ścinająca F<sub>v,Ed</sub> = (V<sub>Ed</sub> − F<sub>f,Rd</sub>)/n = ${kN(r.Fv1)} kN`);
      h += eq('η', 'F_{v,Ed}/F_{2,vb,Rd} + F_{t,Ed}/(1,4·F_{t,Rd})', `${kN(r.Fv1)}/${kN(C.F2vb)} + ${kN(r.Ft1)}/(1,4·${kN(C.FtRd)})`, fm(r.uTV, 3), '', 'tabl. 3.4');
      h += `<div class="eq">→ η = <b>${fm(c.util * 100, 1)}%</b>${okS(c.util)}</div>`;
      break;
    case 'PBWf': case 'PBWw':
      h += eq('f_{vw,d}', 'f_u/√3/(β_w·γ_{M2})', '', fm(C.fvwd, 1), 'MPa', '4.5.3.3 (4.4)');
      if (c.id === 'PBWf') { h += eq('F_f', '|M_{y,Ed}|/(h − t_f) + |N_{Ed}|·A_f/A', '', kN(r.wf.Ff1), 'kN', 'metoda uproszczona') + eq('f_w', '√[(F_f/(a_f·l_{wf}))² + (V_y/(2a_f·l_{wf}))²]', `a_f = ${fm(C.af, 0)} mm, l<sub>wf</sub> = ${fm(C.lwf, 0)} mm`, fm(r.wf.fw, 1), 'MPa', '4.5.3.3'); h += verd(fm(r.wf.fw, 1), fm(C.fvwd, 1), c.util, 'MPa'); }
      else { h += eq('f_w', 'V_{z,Ed}/(a_w·l_{ww})', `${kN(fo.Vz)}·10³/(${fm(C.aw, 0)}·${fm(C.lww, 0)})`, fm(r.wf.fvz, 1), 'MPa'); h += verd(fm(r.wf.fvz, 1), fm(C.fvwd, 1), c.util, 'MPa'); }
      break;
    case 'PBe': case 'PBp': case 'PBk': {
      const g = C.geo;
      h += line(`Kotwy ${C.nb} × ${esc((C.kt && C.kt.d) || '')}, otwory w blasze d<sub>0</sub> = ${fm(g.d0, 0)} mm (otwory powiększone pod kotwy); układ: ${C.uk === 'zew' ? '2 rzędy poza pasami' : C.nb === 2 ? '2 kotwy w osi' : '4 kotwy między pasami'}; blacha ${fm(C.lp, 0)} × ${fm(C.bp, 0)} mm`, 'PN-EN 1993-1-8, tabl. 3.3');
      if (c.id === 'PBe') {
        h += eq('e_y', '(b_p − w)/2', `(${fm(C.bp, 0)} − ${fm(g.pY, 0)})/2`, fm(g.eY, 1), 'mm') + eq('e_z', C.uk === 'zew' ? 'l_p/2 − z_T' : g.pZ !== null ? '(l_p − p)/2' : 'l_p/2', C.uk === 'zew' ? `${fm(C.lp, 0)}/2 − ${fm(g.pZ / 2, 1)}` : g.pZ !== null ? `(${fm(C.lp, 0)} − ${fm(g.pZ, 0)})/2` : '', fm(g.eZ, 1), 'mm');
        h += eq('e_{min}', '1,2·d_0', `1,2·${fm(g.d0, 0)}`, fm(g.eMin, 1), 'mm', 'tabl. 3.3');
        h += verd(fm(g.eMin, 1), fm(g.eGov, 1), c.util, 'mm');
        h += line(`Uwaga: dla elementów narażonych na korozję zaleca się e ≤ 4t + 40 mm = ${fm(g.eMaxCorr, 0)} mm (tabl. 3.3, wartość maksymalna).`);
      } else if (c.id === 'PBp') {
        h += eq('p_2', 'w (rozstaw kotew w rzędzie, kierunek y)', '', fm(g.pY, 1), 'mm') + eq('p_{2,min}', '2,4·d_0', `2,4·${fm(g.d0, 0)}`, fm(g.p2Min, 1), 'mm', 'tabl. 3.3');
        if (g.pZ !== null) h += eq('p_1', C.uk === 'zew' ? '2z_T (rozstaw rzędów, kierunek z)' : 'p (rozstaw rzędów, kierunek z)', '', fm(g.pZ, 1), 'mm') + eq('p_{1,min}', '2,2·d_0', `2,2·${fm(g.d0, 0)}`, fm(g.p1Min, 1), 'mm', 'tabl. 3.3');
        h += eq('η', g.pZ !== null ? 'max(p_{2,min}/p_2; p_{1,min}/p_1)' : 'p_{2,min}/p_2', '', fm(c.util, 3), '≤ 1', '', c.util <= 1 ? ['ok', '✔'] : ['fail', '✖']);
      } else {
        h += line('Wymaganie konstrukcyjno-montażowe: podkładka i nakrętka kotwy nie mogą nachodzić na spoinę słupa z blachą; potrzebny luz na klucz.');
        h += eq('c_{req}', 'a√2 + d_w/2 + 5', `${fm(g.weldLeg, 1)} + ${fm(g.dw, 0)}/2 + 5`, fm(g.cReq, 1), 'mm', 'd_w ≈ 2d – podkładka');
        h += line(g.inside ? '<span class="fail">Oś kotwy w obrysie przekroju słupa – układ niewykonalny.</span>' : `Najmniejsza odległość osi kotwy od obrysu słupa (lico pasa / środnika / ścianki): <b>${fm(g.clr, 1)} mm</b>`);
        h += verd(fm(g.cReq, 1), g.inside ? '0' : fm(g.clr, 1), c.util, 'mm');
      }
      break;
    }
    case 'PBS': {
      const s1 = d, st = C.stiff;
      h += line(`k<sub>13</sub> (beton) = E<sub>c</sub>√(b<sub>eff</sub>l<sub>eff</sub>)/(1,275E) = ${fm(st.k13, 2)} mm; k<sub>15</sub> (blacha) = ${fm(st.k15, 3)} mm; k<sub>16</sub> (kotwy) = ${fm(st.k16, 3)} mm`, 'tabl. 6.11');
      h += eq('S_{j,ini}', 'E·z²/(1/k_T + 1/k_C)·e/(e + e_k)', '', fm(s1.Sj / 1e9, 2), 'MNm/rad', '6.3.4 (6.27)') + eq('30·EI_c/L_c', '', '', fm(30 * s1.EIL / 1e9, 2), 'MNm/rad', '5.2.2.5(4)');
      h += line(`klasyfikacja: <b>${esc(s1.cls)}</b>${s1.inModel ? '; podatność uwzględniona w modelu jako sprężyna obrotowa k = ' + fm(s1.inModel.Sj / 1e9, 2) + ' MNm/rad (czyste zginanie)' : ''}`);
      break;
    }
    default: break;
  }
  return h;
};

/* ---------------------------------------------------------------- pożar */
RP.tokFire = function (c, R, S) {
  const fr = R.fire, a = fr.atR, E = fr.Efi;
  let h = `<h3>Odporność ogniowa R ${fr.Rreq}</h3>`;
  h += line(`Kombinacja w sytuacji pożarowej ${cmb(fr.combo)}: N<sub>fi,Ed</sub> = ${kN(E.N)} kN, M<sub>y,fi,Ed</sub> = ${kNm(E.My)} kNm, M<sub>z,fi,Ed</sub> = ${kNm(E.Mz)} kNm`, 'PN-EN 1990, 6.4.3.3');
  h += line(`Wskaźnik ekspozycji A<sub>m</sub>/V = ${fm(fr.sf.AmV, 1)} m⁻¹ (pudełkowy ${fm(fr.sf.AmVb, 1)} m⁻¹)${fr.prot ? `, A<sub>p</sub>/V = ${fm(fr.sf.ApV, 1)} m⁻¹ – ochrona d<sub>p</sub> = ${esc(S.pozar.dp)} mm, λ<sub>p</sub> = ${esc(S.pozar.lp)} W/mK` : `, k<sub>sh</sub> = ${fm(fr.ksh, 3)}`}`, fr.prot ? 'PN-EN 1993-1-2, 4.2.5.2' : 'PN-EN 1993-1-2, 4.2.5.1');
  h += line(`Temperatura stali po ${fr.Rreq} min (krzywa ISO 834, krok 2 s): <b>θ<sub>a</sub> = ${fm(fr.thR, 0)} °C</b>`, '4.2.5');
  if (fr.cls4) h += line('Przekrój klasy 4 w pożarze – temperatura krytyczna θ<sub>cr</sub> = 350 °C', '4.2.3.6');
  else {
    h += line(`w θ<sub>a</sub> = ${fm(fr.thR, 0)} °C: k<sub>y,θ</sub> = ${fm(a.ky, 3)}, k<sub>E,θ</sub> = ${fm(a.kE, 3)}; klasa w pożarze (ε = 0,85√(235/f<sub>y</sub>)): <b>${a.cls}</b>`, '3.2.1, 4.2.2');
    h += line(`α = 0,65√(235/f<sub>y</sub>) = ${fm(a.al, 3)}; λ̄<sub>y,θ</sub> = ${fm(a.lyT, 3)}, λ̄<sub>z,θ</sub> = ${fm(a.lzT, 3)} → χ<sub>y,fi</sub> = ${fm(a.cy, 3)}, χ<sub>z,fi</sub> = ${fm(a.cz, 3)}${a.cLT < 1 ? `; λ̄<sub>LT,θ</sub> = ${fm(a.lLTt, 3)} → χ<sub>LT,fi</sub> = ${fm(a.cLT, 3)}` : ''}`, '4.2.3.2, 4.2.3.3');
    h += line(`β<sub>M,y</sub> = ${fm(a.bMy.v, 3)}, β<sub>M,z</sub> = ${fm(a.bMz.v, 3)}; μ<sub>y</sub> = ${fm(a.muy, 3)}, μ<sub>z</sub> = ${fm(a.muz, 3)}, k<sub>y</sub> = ${fm(a.kyF, 3)}, k<sub>z</sub> = ${fm(a.kzF, 3)}, k<sub>LT</sub> = ${fm(a.kLT, 3)}`, '4.2.3.5, rys. 4.2');
    h += eq('η_{fi,a}', 'N/(χ_{min,fi}A k_{y,θ}f_y/γ_{M,fi}) + k_y M_y/(W_y k_{y,θ} f_y/γ_{M,fi}) + k_z M_z/(W_z k_{y,θ} f_y/γ_{M,fi})', '', fm(a.ua, 3), '', '(4.21a/c)');
    h += eq('η_{fi,b}', 'N/(χ_{z,fi}A k_{y,θ}f_y/γ_{M,fi}) + k_{LT}M_y/(χ_{LT,fi}W_y k_{y,θ} f_y/γ_{M,fi}) + k_z M_z/(W_z k_{y,θ} f_y/γ_{M,fi})', '', fm(a.ub, 3), '', '(4.21b/d)');
    h += line(`temperatura krytyczna (η<sub>fi</sub>(θ<sub>cr</sub>) = 1, bisekcja): <b>θ<sub>cr</sub> = ${fm(fr.thcr, 0)} °C</b>; porównawczo wg 4.2.4 (μ<sub>0</sub> = ${fm(fr.mu0, 3)}): ${fm(fr.thcr424, 0)} °C`, '4.2.4');
  }
  h += line(`czas osiągnięcia θ<sub>cr</sub>: ${fr.tcr === null ? `> ${fm(Math.max(fr.Rreq * 1.5, 120), 0)} min` : '<b>' + fm(fr.tcr, 1) + ' min</b>'}`);
  h += verd(fm(fr.thR, 0), fm(fr.thcr, 0), c.util, '°C');
  return h;
};

/* ---------------------------------------------------------------- raport pełny */
RP.build = function (S, R, opt) {
  opt = opt || {};
  if (!R || !R.sec) return '<p>Brak wyników – usuń błędy danych.</p>';
  const sec = R.sec, mat = R.mat, b = R.base, md = R.md, ndp = R.ndp, gen = R.norm ? R.norm.genStosowana : 1;
  const P = (s) => pre(gen) + ', ' + s;
  void P;
  let h = `<h1>Obliczenia statyczno-wytrzymałościowe słupa stalowego – ${esc(S.meta.nazwa)}</h1>`;
  h += `<p>Obiekt: ${esc(S.meta.obiekt)}</p>`;
  if (S.meta.projektant || S.meta.sprawdzajacy) h += `<p>Projektant: ${esc(S.meta.projektant)}${S.meta.nrUprawnien ? ' (upr. ' + esc(S.meta.nrUprawnien) + ')' : ''}${S.meta.sprawdzajacy ? ' · Sprawdzający: ' + esc(S.meta.sprawdzajacy) : ''}${S.meta.data ? ' · Data: ' + esc(S.meta.data) : ''}</p>`;
  // 1. dane
  h += '<h2>1. Dane wejściowe</h2>';
  const bc = md.bc;
  h += line(`Wysokość słupa H = <b>${fm(md.H / 1000, 3)} m</b>`);
  h += line(`Płaszczyzna x–z (zginanie M<sub>y</sub>, wyboczenie względem y–y): podstawa – ${esc(S0.DOL[bc.dol.y])}${bc.dol.y === 'spr' ? ` (k = ${fm(bc.dol.kry / 1e9, 2)} MNm/rad${R.baseSpring ? ', z podatności podstawy' : ''})` : ''}; wierzchołek – ${esc(S0.GORA[bc.gora.y])}`);
  h += line(`Płaszczyzna x–y (zginanie M<sub>z</sub>, wyboczenie względem z–z): podstawa – ${esc(S0.DOL[bc.dol.z])}; wierzchołek – ${esc(S0.GORA[bc.gora.z])}`);
  h += line(`Warunki skrętne: podstawa – ${esc(S0.SKRET_D[bc.dol.skret])}; wierzchołek – ${esc(S0.SKRET_G[bc.gora.skret])}`);
  h += line(md.stez.length ? 'Stężenia pośrednie: ' + md.stez.map((z, i) => `S${i + 1}: x = ${fm(z.x / 1000, 2)} m – blokada ${z.pl === 'yz' ? 'w obu płaszczyznach' : z.pl === 'z' ? 'przemieszczeń w kierunku y (wyboczenie względem z–z)' : 'przemieszczeń w kierunku z (wyboczenie względem y–y)'}${z.wys !== 'srodek' ? `, na wysokości pasa ${z.wys === 'pas+' ? '+z' : '−z'}` : ''}${z.skret ? ', skrętne' : ''}`).join('; ') : 'Stężenia pośrednie: brak');
  h += line(`Przekrój: <b>${esc(sec.nazwa)}</b> – ${sec.opis}`);
  h += line(`Stal: <b>${esc(mat.gatunek + mat.podgatunek)}</b> wg ${esc((M.STAL[mat.gatunek] || {}).norma || '')}; f<sub>y</sub> = ${fm(mat.fy, 0)} MPa, f<sub>u</sub> = ${fm(mat.fu, 0)} MPa (${esc(mat.zr)}); E = 210 000 MPa, G = 81 000 MPa`, '3.2');
  h += line(`Metoda analizy: <b>${R.method === 'I' ? 'analiza I rzędu, stateczność wg 6.3 z długościami wyboczeniowymi z analizy wyboczeniowej (5.2.2(8))' : R.method === 'II_glob' ? 'analiza II rzędu z imperfekcją przechyłową φ; stateczność elementu wg 6.3 z długościami wyboczeniowymi postaci nieprzechyłowej (5.2.2(3)b)' : 'analiza II rzędu z imperfekcjami przechyłową φ i łukowymi e₀; nośność przekroju (6.2) + zwichrzenie / wyboczenie skrętne wg 6.3 (5.2.2(3)a, 5.3.2)'}</b>`, '5.2.2');
  h += line(`Interakcja N–M: metoda ${R.res && R.res[0] && R.res[0].variants[0].mem && R.res[0].variants[0].mem.segs[0] ? 'zał. ' + R.res[0].variants[0].mem.segs[0].meth : '—'}; zwichrzenie: ${esc(ndp.ltbMet)}`, '6.3.3(5)');
  if (S.meta.opis) h += `<p class="note">${esc(S.meta.opis)}</p>`;
  // 2. podstawa normowa
  h += '<h2>2. Podstawa normowa</h2>';
  (R.norm ? R.norm.dokumenty : []).forEach(d => { h += `<div class="eq"><b>${esc(d.oznaczenie)}</b> – ${esc(d.tytul)}${d.zmiany.length ? '; zmiany: ' + esc(d.zmiany.join(', ')) : ''}${d.poprawki.length ? '; poprawki: ' + esc(d.poprawki.join(', ')) : ''}${d.zk ? '; ZK: ' + esc(d.zk) : ''} – ${esc(d.zakres)}</div>`; });
  if (R.norm) h += `<p class="note">${esc(R.norm.decyzja)}</p>`;
  const ndpL = ['gM0', 'gM1', 'gM2', 'gG_sup', 'gG_inf', 'gQ', 'xi', 'komb', 'phi0', 'alfaCr', 'lamLT0', 'betaLT', 'ltbMet', 'interMet', 'eta', 'Cfd', 'betaJ', 'gc', 'gMfi'];
  h += tbl(['parametr', 'wartość', 'źródło'], ndpL.map(k => [esc(N.NDP1_PL[k] ? N.NDP1_PL[k].d : k), typeof ndp[k] === 'number' ? fm(ndp[k], 3) : esc(ndp[k]), esc(N.NDP1_PL[k] ? N.NDP1_PL[k].ref : '') + ((R.norm && R.norm.ndpZmienione || []).includes(k) ? ' <b>(zmieniono)</b>' : '')]));
  // 3. przekrój
  h += '<h2>3. Przekrój i nośności obliczeniowe</h2>';
  h += `<div class="fig">${D.section(sec, { size: 230, eff: b.effN || b.effMy })}<div>${RP.secTable(sec)}</div></div>`;
  h += line(`Klasa przy ściskaniu: <b>${b.kN.cls}</b>; przy zginaniu M<sub>y</sub>: <b>${b.kMy.cls}</b>; przy zginaniu M<sub>z</sub>: <b>${b.kMz.cls}</b> (ε = ${fm(b.eps, 3)})`, '5.5, tabl. 5.2');
  h += RP.classTable(b.kN);
  h += eq('N_{pl,Rd}', 'A·f_y/γ_{M0}', `${cm2(sec.A)}·10²·${fm(mat.fy, 0)}/${fm(ndp.gM0, 2)}`, kN(b.Npl), 'kN', '6.2.3');
  if (b.effN) h += eq('N_{c,Rd}', 'A_{eff}·f_y/γ_{M0}', `${cm2(b.Aeff)}·10²·${fm(mat.fy, 0)}/${fm(ndp.gM0, 2)}`, kN(b.Nc), 'kN', '6.2.4');
  h += eq('M_{c,y,Rd}', `W_y·f_y/γ_{M0} (${b.kMy.cls <= 2 ? 'W_{pl,y}' : b.kMy.cls === 3 ? 'W_{el,y}' : 'W_{eff,y}'})`, `${cm3(b.Wy)}·10³·${fm(mat.fy, 0)}/${fm(ndp.gM0, 2)}`, kNm(b.Mcy), 'kNm', '6.2.5');
  h += eq('M_{c,z,Rd}', `W_z·f_y/γ_{M0}`, `${cm3(b.Wz)}·10³·${fm(mat.fy, 0)}/${fm(ndp.gM0, 2)}`, kNm(b.Mcz), 'kNm', '6.2.5');
  h += eq('V_{pl,z,Rd}', 'A_{v,z}·(f_y/√3)/γ_{M0}', '', kN(b.Vplz), 'kN', '6.2.6') + eq('V_{pl,y,Rd}', 'A_{v,y}·(f_y/√3)/γ_{M0}', '', kN(b.Vply), 'kN', '6.2.6');
  // 4. obciążenia
  h += '<h2>4. Obciążenia i kombinacje</h2>';
  h += tbl(['ozn.', 'nazwa', 'rodzaj', 'ψ₀ / ψ₁ / ψ₂', 'składniki (wartości charakterystyczne)'], md.cases.map(c => {
    const ps = BS.K.psi(c.c);
    const sk = c.parts.map(p => p.typ === 'N' ? `N = ${fm(p.F / 1e3, 2)} kN na x = ${fm(p.x / 1000, 2)} m${p.ey || p.ez ? ` (e<sub>y</sub> = ${fm(p.ey, 0)}, e<sub>z</sub> = ${fm(p.ez, 0)} mm)` : ''}` : p.typ === 'Nq' ? `ciężar ${fm(p.q, 3)} kN/m` : p.typ === 'H' ? `H<sub>${p.kier}</sub> = ${fm(p.F / 1e3, 2)} kN na x = ${fm(p.x / 1000, 2)} m` : p.typ === 'q' ? `q<sub>${p.kier}</sub> = ${fm(p.q0, 2)}${p.q1 !== p.q0 ? '…' + fm(p.q1, 2) : ''} kN/m na ${fm(p.x0 / 1000, 2)}–${fm(p.x1 / 1000, 2)} m${p.wys !== 'srodek' ? ` (pas ${p.wys === 'pas+' ? '+z' : '−z'})` : ''}` : `M<sub>${p.os}</sub> = ${fm(p.M / 1e6, 2)} kNm na x = ${fm(p.x / 1000, 2)} m`).join('; ');
    return [esc(c.c.id), esc(c.c.nazwa), esc((S0.RODZAJE[c.c.rodzaj] || {}).n || c.c.rodzaj) + (c.c.wyklucz ? ` <small>(grupa „${esc(c.c.wyklucz)}”)</small>` : ''), S0.RODZAJE[c.c.rodzaj] && S0.RODZAJE[c.c.rodzaj].stale ? '—' : ps.map(v => fm(v, 2)).join(' / '), sk];
  }));
  const cnt = (t) => R.combos.filter(c => c.typ === t).length;
  h += line(`Kombinacje wg PN-EN 1990: SGN ${cnt('SGN')} (${ndp.komb === '6.10' ? '6.10' : '6.10a/6.10b'}, γ<sub>G,sup</sub> = ${fm(ndp.gG_sup, 2)}, γ<sub>G,inf</sub> = ${fm(ndp.gG_inf, 2)}, γ<sub>Q</sub> = ${fm(ndp.gQ, 2)}, ξ = ${fm(ndp.xi, 2)}), charakterystyczne ${cnt('char')}, częste ${cnt('czest')}, quasi-stałe ${cnt('qp')}${cnt('poz') ? ', pożarowe ' + cnt('poz') : ''}${cnt('wyj') ? ', wyjątkowe ' + cnt('wyj') : ''}`, 'PN-EN 1990, 6.4.3, 6.5.3, zał. A1');
  if (opt.combos !== false) h += `<details><summary>Lista kombinacji SGN</summary>${tbl(['nr', 'kombinacja'], R.combos.filter(c => c.typ === 'SGN' || c.typ === 'wyj').map(c => [c.id, esc(c.opis)]))}</details>`;
  // 5. analiza globalna
  h += '<h2>5. Analiza globalna, imperfekcje, siły wewnętrzne</h2>';
  h += mk('acr', RP.tok(R.checks.find(c => c.id === 'acr'), R, S));
  const im = R.imp, ph = im.phi;
  if (R.method !== 'I') {
    h += `<h3>Imperfekcja przechyłowa</h3>`;
    h += ph.manual ? eq('φ', '', '', `1/${fm(1 / ph.phi, 0)}`, '', 'przyjęto ręcznie') : eq('φ', 'φ_0·α_h·α_m', `(1/${fm(1 / ph.phi0, 0)})·${fm(ph.ah, 3)}·${fm(ph.am, 3)}`, `${fm(ph.phi, 5)} = 1/${fm(1 / ph.phi, 0)}`, '', '5.3.2(3) (5.5)');
    if (!ph.manual) h += line(`α<sub>h</sub> = 2/√h = 2/√${fm(ph.h, 2)} (2/3 ≤ α<sub>h</sub> ≤ 1) = ${fm(ph.ah, 3)}; α<sub>m</sub> = √(0,5(1 + 1/m)), m = ${ph.m} → ${fm(ph.am, 3)}`, '5.3.2(3)');
    h += line(`Imperfekcję przechyłową stosuje się w płaszczyznach z postacią przechyłową (${['y', 'z'].filter(p => md.sway[p]).map(p => S0.PLS[p]).join(', ') || 'brak'}), w jednym kierunku naraz, z oboma zwrotami; pomijana, gdy H<sub>Ed</sub> ≥ ${fm(ndp.HV015, 2)}·V<sub>Ed</sub>${(S.analiza.imp || {}).pomin015 === false ? ' (opcja wyłączona)' : ''}. Wprowadzona jako geometria początkowa d₀ = φ·x (obciążenie zastępcze K<sub>G</sub>·d₀).`, '5.3.2(4), (7), (8)');
  }
  if (R.method === 'II_pelna') {
    h += `<h3>Imperfekcje łukowe</h3>`;
    ['y', 'z'].forEach(pl => { h += line(`${S0.PLS[pl]}: ${esc(im.e0Src[pl])}; odcinki: ${im.bow[pl].map(s => `${fm(s.x0 / 1000, 2)}–${fm(s.x1 / 1000, 2)} m (e₀ = ${fm((s.x1 - s.x0) / im.e0L[pl], 1)} mm)`).join(', ')}`, '5.3.2(3)b, tabl. 5.1'); });
  }

RP.statics = function (S, R) {
  const full = RP.build(S, R, { combos: true });

  return (cut > 0 ? full.slice(0, cut) : full) + `<p class="note">${esc(BS.APP)} ${esc(BS.VERSION)} · SHA-256: ${esc(R.hash)}</p>`;

})();

function inlineEdit(x, y, key, label, after, bv) {
  const old = $('.inled'); if (old) old.remove();
  const v = bv !== undefined && bv !== null && bv !== '' ? Math.round(+bv * 10) / 10 : Q.getP(S(), key);
  const d = document.createElement('div'); d.className = 'inled';
  d.innerHTML = `<label>${sym(label)}</label><input class="txt" value="${esc(showNum(v))}" autocomplete="off"><span class="u">mm</span><small>Enter – zastosuj, Esc – anuluj</small>`;
  document.body.appendChild(d);
  const r = d.getBoundingClientRect();
  d.style.left = Math.max(4, Math.min(window.innerWidth - r.width - 4, x - 20)) + 'px'; d.style.top = Math.max(4, Math.min(window.innerHeight - r.height - 4, y + 10)) + 'px';
  const inp = d.querySelector('input'); inp.focus(); inp.select();
  let done = false;
  const close = () => { done = true; d.remove(); document.removeEventListener('pointerdown', outside, true); };
  const apply = () => {
    if (done) return;
    const n = parseNum(inp.value);
    if (n === null || !(n > 0)) { inp.classList.add('bad'); return; }
    close();
    if (n === U.num(v)) return;
    if (DERIV[key]) { const [k2, v2] = DERIV[key](n, S()); if (!(v2 > 0)) { Q.toast('Wartość poza zakresem – wymiar wynikowy byłby ≤ 0.'); return; } Q.setP(S(), k2, Math.round(v2 * 10) / 10); }
    else Q.setP(S(), key, n);
    A.changed(true); if (after) after();
  };
  const outside = (e) => { if (!d.contains(e.target)) apply(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); apply(); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); } });
  setTimeout(() => document.addEventListener('pointerdown', outside, true), 0);
}

const STL = { ok: 'spełniony', warn: 'uwaga', fail: 'niespełniony', info: 'informacja' };
const unitV = (v, u) => (v === null || v === undefined || !isFinite(v) ? '—' : u === 'F' ? fmt(v / 1e3, 2) + ' kN' : u === 'M' ? fmt(v / 1e6, 2) + ' kNm' : u === 'mm' ? fmt(v, 1) + ' mm' : u === 'MPa' ? fmt(v, 1) + ' MPa' : u === '°C' ? fmt(v, 0) + ' °C' : fmt(v, 3));
const ckCond = (c) => c.unit === '-' ? (c.info ? fmt(c.Rd, 2) : `${fmt(c.util, 3)} ≤ 1`) : `${unitV(c.Ed, c.unit)} ${c.util <= 1 ? '≤' : '>'} ${unitV(c.Rd, c.unit)}`;
const utilBar = (c) => { const u = c.util !== null && isFinite(c.util) ? c.util : Infinity, w = Math.min(100, (isFinite(u) ? u : 1) * 100); return `<span style="display:inline-block;width:120px;height:9px;border-radius:5px;background:var(--line2);vertical-align:middle;margin-right:8px;overflow:hidden"><span style="display:block;height:100%;width:${w}%;background:var(--${u > 1 ? 'fail' : u > 0.9 ? 'warn' : 'ok'})"></span></span><b>${isFinite(u) ? fmt(u * 100, 0) + '%' : '∞'}</b>`; };
A.explainPopup = function (c, back) {
  const r = R();
  const html = BS.Raport.frag(c, r, S());
  const st = c.info ? 'info' : c.status;
  const m = Q.modal(`<h3>Jak obliczono: ${sym(c.n)}</h3><p class="hint">${esc(c.grp || '')}${c.ref ? ' · ' + esc(c.ref) : ''}${c.x !== undefined && c.x !== null && isFinite(c.x) ? ` · x = ${fmt(c.x / 1000, 2)} m` : ''}${c.combo ? ' · ' + esc(c.combo) : ''}</p>
    <div class="xbox"><table class="kv"><tr><td>Warunek</td><td class="n"><b>${ckCond(c)}</b></td></tr><tr><td>Wytężenie</td><td>${utilBar(c)}</td></tr><tr><td>Status</td><td><span class="st ${st}">${STL[st] || st}</span></td></tr></table>${c.note ? `<p class="hint">${esc(c.note)}</p>` : ''}</div>
    <div class="rexp xrep">${html}</div><div class="dbtn"><button class="btn" id="nNorm" type="button">Punkt normy…</button><button class="btn" id="nGo" type="button" title="Przejdź do danych / wyników, od których zależy ten warunek">Pokaż miejsce →</button><button class="btn" id="nRep" type="button">W raporcie</button>${back ? '<button class="btn" id="nBack" type="button">← Podstawa</button>' : ''}<span style="flex:1"></span><button class="btn pri" id="nClose" type="button">Zamknij</button></div>`, 'expl');
  $('#nClose', m).onclick = closeM; $('#nNorm', m).onclick = () => A.normPopup(c); $('#nGo', m).onclick = () => A.gotoCheck(c); $('#nRep', m).onclick = () => A.gotoReport(c);
  if (back) $('#nBack', m).onclick = () => A.basePopup();
};
// „pokaż miejsce”: przejście do zakładki / pól danych, od których zależy warunek (jak w BelkaStal)
A.gotoCheck = function (c) {
  const id = c.id || '', grp = c.grp || '', r = R();
  const ci = r && r.checks ? r.checks.indexOf(c) : -1;
  const go = (tab, fn) => { closeM(); A.selectTab(tab); setTimeout(() => { try { if (fn) fn(); } catch (e) { console.error(e); } }, 90); };
  const hl = (sel) => Q.hlg(sel);
  const row = (tab) => () => hl(`#p-${tab} tr[data-ci="${ci}"]`) || hl(`#p-${tab} .box`);
  const fields = (gid, keys) => () => { const d = $(`#inputs details[data-g="${gid}"]`); if (d) d.open = true; const els = keys.map(k => $(`#inputs [data-k="${k}"]`)).filter(Boolean); if (!hl(els)) hl(`#inputs details[data-g="${gid}"] summary`); };
  if (id === 'acr') return go('data', fields('an', ['analiza.metoda', 'analiza.imp.m', 'analiza.imp.phi']));
  if (/^(N|MN|Vy|Vz)$/.test(id)) return go('sec', () => { if (c.x !== undefined && c.x !== null && isFinite(c.x)) A.setSecX(c.x); if (!hl(`#p-sec tr[data-ci="${ci}"]`)) hl('#p-sec .zhit'); });
  if (/^(By|Bz|BT|GM)$|^LT\d|^I6[12]_/.test(id)) return go('stab', row('stab'));
  if (/^w[yz]$/.test(id)) return go('data', fields('sls', ['sgu.typ', id === 'wy' ? 'sgu.lim' : 'sgu.limZ']));

A.gotoReport = function (c) {

    const walker = document.createTreeWalker(rep, NodeFilter.SHOW_COMMENT);
    let n; while ((n = walker.nextNode())) { if (n.nodeValue === 'ck:' + c.id) { const el = n.nextSibling && n.nextSibling.nodeType === 1 ? n.nextSibling : n.parentElement; el.scrollIntoView({ block: 'start' }); Q.flash(el); break; } }
  }, 150);

<script>/* src/ui/widok3d.js */
/* =====================================================================
   SłupStal – zakładka „Słup i podstawa” (jak „Zbrojenie słupa” w SłupŻB):
   • widok 2D: słup w dwóch płaszczyznach z blachą podstawy, podlewką,
     fundamentem, kotwami, głowicą i stężeniami – elementy klikalne
     (przekrój, podstawa, fundament, stężenia, podpory), przekrój i siły
     pod kursorem (panel obok), klik – siły i sprawdzenia na tej wysokości;
   • widok 3D (canvas): obrót, przesuw, powiększenie (mysz, dotyk, Ctrl +
     kółko, +/−, ⌂), cieniowanie ścian, opcjonalnie obciążenia i postacie
     utraty stateczności (giętna, giętno-skrętna u–φ, zwichrzenie) oraz
     przemieszczenia SGU – w skali powiększonej;
   • zestawienie materiałów (słup, blachy, kotwy, spoiny) i eksport DXF
     (AutoCAD R12, ASCII): widok słupa i rzut blachy podstawy z wymiarami.
   ===================================================================== */
(function () {
'use strict';
const BS = window.BS, U = BS.U, D = BS.D, Q = BS.Q, M = BS.M;
const { $, $$, esc, fmt, tx, svgOpen } = Q;
const W3 = BS.W3 = {};
const A = () => BS.A;
const C = D.C;

/* ================================================================ GEOMETRIA 3D */
// układ: X – oś y przekroju (szerokość pasa), Y – oś słupa (w górę), Z – oś z przekroju (wysokość h); [mm]
function sceneOf(S, R, opt) {
  opt = opt || {};
  const sec = R.sec, H = R.md ? R.md.H : U.num(S.geom.H) * 1000;
  const faces = [], lines = [], labels = [];
  const NS = 12;                                    // podział słupa na wysokości (kolejność rysowania)
  const box = (x0, x1, y0, y1, z0, z1, col, kind, alpha) => {
    const c = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
    [[0, 3, 2, 1], [4, 5, 6, 7], [0, 1, 5, 4], [3, 7, 6, 2], [0, 4, 7, 3], [1, 2, 6, 5]].forEach(f => faces.push({ p: f.map(i => c[i]), col, kind, alpha: alpha === undefined ? 1 : alpha }));
  };
  const boxCol = (x0, x1, z0, z1, y0, y1, col, kind) => { for (let i = 0; i < NS; i++) box(x0, x1, y0 + (y1 - y0) * i / NS, y0 + (y1 - y0) * (i + 1) / NS, z0, z1, col, kind); };
  const cyl = (r, y0, y1, col, kind, inner, nY) => {
    const n = 28; nY = nY || NS;
    for (let k = 0; k < nY; k++) {
      const ya = y0 + (y1 - y0) * k / nY, yb = y0 + (y1 - y0) * (k + 1) / nY;
      for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI, b = (i + 1) / n * 2 * Math.PI; const p = [[r * Math.cos(a), ya, r * Math.sin(a)], [r * Math.cos(b), ya, r * Math.sin(b)], [r * Math.cos(b), yb, r * Math.sin(b)], [r * Math.cos(a), yb, r * Math.sin(a)]]; faces.push({ p: inner ? p.reverse() : p, col, kind, alpha: 1 }); }
    }
  };
  const ring = (ro, ri, y, col, kind, up) => { const n = 28; for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI, b = (i + 1) / n * 2 * Math.PI; const p = [[ro * Math.cos(a), y, ro * Math.sin(a)], [ro * Math.cos(b), y, ro * Math.sin(b)], [ri * Math.cos(b), y, ri * Math.sin(b)], [ri * Math.cos(a), y, ri * Math.sin(a)]]; faces.push({ p: up ? p.reverse() : p, col, kind, alpha: 1 }); } };
  const STEEL = '#9fb0c8', PLATE = '#7f8ea8', CONC = '#c9ced6', ANCH = '#c0262d', BRACE = '#c98a2e';
  // ---- słup
  if (sec.kind === 'I') {
    const h = sec.h, bg = sec.bg, bd = sec.bd, tg = sec.tg, td = sec.td, tw = sec.tw, z0 = -h / 2;
    boxCol(-bd / 2, bd / 2, z0, z0 + td, 0, H, STEEL, 'col');
    boxCol(-bg / 2, bg / 2, z0 + h - tg, z0 + h, 0, H, STEEL, 'col');
    boxCol(-tw / 2, tw / 2, z0 + td, z0 + h - tg, 0, H, STEEL, 'col');
  } else if (sec.kind === 'RHS') {
    const h = sec.h, b = sec.b, t = sec.t;
    boxCol(-b / 2, b / 2, -h / 2, -h / 2 + t, 0, H, STEEL, 'col'); boxCol(-b / 2, b / 2, h / 2 - t, h / 2, 0, H, STEEL, 'col');
    boxCol(-b / 2, -b / 2 + t, -h / 2 + t, h / 2 - t, 0, H, STEEL, 'col'); boxCol(b / 2 - t, b / 2, -h / 2 + t, h / 2 - t, 0, H, STEEL, 'col');
  } else if (sec.kind === 'CC') {
    const h = sec.h, tw = sec.tw, tf = sec.tf, b = sec.ch.b, z0 = -h / 2;
    [-1, 1].forEach(sg => {
      const back = sec.uklad === 'wew' ? sg * sec.B / 2 : sg * sec.a / 2, dir = sec.uklad === 'wew' ? -sg : sg;   // kierunek półek od grzbietu
      const yA = Math.min(back, back + dir * tw), yB = Math.max(back, back + dir * tw), fA = Math.min(back, back + dir * b), fB = Math.max(back, back + dir * b);
      boxCol(yA, yB, z0 + tf, z0 + h - tf, 0, H, STEEL, 'col');
      boxCol(fA, fB, z0, z0 + tf, 0, H, STEEL, 'col'); boxCol(fA, fB, z0 + h - tf, z0 + h, 0, H, STEEL, 'col');
    });
    // przewiązki (płaszczyzny półek) / przekładki (między grzbietami) – co a_p, także na końcach
    const pos = []; for (let x = sec.pb / 2; x <= H - sec.pb / 2 + 1; x += sec.pa) pos.push(x); if (H - sec.pb / 2 - pos[pos.length - 1] > 0.3 * sec.pa) pos.push(H - sec.pb / 2);
    pos.forEach(x => {
      if (sec.bu && !sec.buPack) { const yb = sec.h0 / 2 + (sec.pz || 40) / 2; [[z0 - sec.pt, z0], [z0 + h, z0 + h + sec.pt]].forEach(([za, zb]) => box(-yb, yb, x - sec.pb / 2, x + sec.pb / 2, za, zb, PLATE, 'col')); }
      else box(-sec.a / 2, sec.a / 2, x - sec.pb / 2, x + sec.pb / 2, -0.35 * h, 0.35 * h, PLATE, 'col');
    });
  } else { cyl(sec.D / 2, 0, H, STEEL, 'col'); cyl(sec.D / 2 - sec.t, 0, H, STEEL, 'col', true); ring(sec.D / 2, sec.D / 2 - sec.t, H, STEEL, 'col', true); }
  const hh = sec.h, bb = sec.kind === 'I' ? Math.max(sec.bg, sec.bd) : sec.kind === 'CC' ? sec.B : sec.b;
  // ---- głowica (orientacyjnie) gdy wierzchołek podparty
  const topSup = R.md && ['prz', 'utw', 'utwp'].some(g => R.md.bc.gora.y === g || R.md.bc.gora.z === g);
  if (topSup && sec.kind !== 'CHS') box(-bb / 2 - 20, bb / 2 + 20, H, H + 15, -hh / 2 - 20, hh / 2 + 20, PLATE, 'cap');
  // ---- podstawa
  const pb = R.pb && R.pb.C && !R.pb.C.err.length ? R.pb.C : null;
  const o = S.podstawa || {};
  if (o.aktywna && pb) {
    const lp = pb.lp, bp = pb.bp, tp = pb.tp, tg = pb.tg || 0;
    box(-bp / 2, bp / 2, -tp, 0, -lp / 2, lp / 2, PLATE, 'plate');
    if (tg > 0) box(-bp / 2 + 5, bp / 2 - 5, -tp - tg, -tp, -lp / 2 + 5, lp / 2 - 5, '#b7bcc5', 'grout');
    if (opt.found !== false) {
      const aF = U.num(o.aF) || bp + 600, bF = U.num(o.bF) || lp + 600, hF = Math.min(U.num(o.hF) || 800, 1200);
      box(-aF / 2, aF / 2, -tp - tg - hF, -tp - tg, -bF / 2, bF / 2, CONC, 'found', 0.32);
    }
    // kotwy
    const pts = [];
    if (pb.uk === 'zew') [1, -1].forEach(sz => [1, -1].forEach(sy => pts.push([sy * pb.w / 2, sz * pb.zT])));
    else if (pb.nb === 2) [1, -1].forEach(sy => pts.push([sy * pb.w / 2, 0]));
    else [1, -1].forEach(sz => [1, -1].forEach(sy => pts.push([sy * pb.w / 2, sz * pb.zT])));
    const lA = Math.max(300, 20 * pb.d);
    pts.forEach(([x, z]) => {
      lines.push({ a: [x, 1.6 * pb.d, z], b: [x, -tp - tg - lA, z], col: ANCH, w: Math.max(2, pb.d / 9), kind: 'anchor' });
      box(x - 0.9 * pb.d, x + 0.9 * pb.d, 0, 0.8 * pb.d, z - 0.9 * pb.d, z + 0.9 * pb.d, '#6b7584', 'nut');

/* ================================================================ DXF (AutoCAD R12) */
const encD = t => String(t).replace(/[⌀ØøΦ]/g, '%%c').replace(/°/g, '%%d').replace(/±/g, '%%p').replace(/[^\x20-\x7e]/g, ch => '\\U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0'));

  h += `<div class="cards"><div class="card ${f.ok ? 'ok' : 'fail'}"><div class="t">θ<sub>a</sub> po R${f.Rreq}</div><div class="v">${fmt(f.thR, 0)} °C</div><div class="s">θ<sub>cr</sub> = ${fmt(f.thcr, 0)} °C</div></div><div class="card"><div class="t">czas do θ<sub>cr</sub></div><div class="v">${f.tcr === null ? '> ' + fmt(Math.max(f.Rreq * 1.5, 120), 0) : fmt(f.tcr, 0)} min</div><div class="s">${f.prot ? 'z ochroną' : 'bez ochrony'}; A<sub>m</sub>/V = ${fmt(f.sf.AmV, 0)} m⁻¹</div></div><div class="card"><div class="t">wytężenie w pożarze</div><div class="v">${fmt(f.uR * 100, 0)}%</div><div class="s">w θ<sub>a</sub>(R${f.Rreq})</div></div></div>`;
  h += `<div class="fig">${D.fire(f, { width: 680 })}</div>`;
  h += tableChecks(r.checks.filter(c => c.id === 'FI'));
  el.innerHTML = h; bindHead(el); bindChecks(el);
};

/* ================================================================ PODSUMOWANIE */
V.sum = function (el) {
  const r = R();
  if (!r || !r.checks || (r.errors.length && !r.checks.length)) { el.innerHTML = head(el, 'Podsumowanie') + errBox(); bindHead(el); return; }
  const c = r.checks, st = S();
  const worst = (pred) => { const a = c.filter(pred).filter(x => !x.info && x.util !== null); return a.length ? a.reduce((p, q) => ((q.util || 0) > (p.util || 0) ? q : p)) : null; };
  const card = (t, v, s2, ck) => `<div class="card ${ck ? ck.status : ''}" ${ck ? `data-gck="${esc(ck.id)}" style="cursor:pointer"` : ''}><div class="t">${t}</div><div class="v">${v}</div><div class="s">${s2}</div></div>`;
  const wS = worst(x => /^Nośność przekroju/.test(x.grp)), wI = worst(x => /^I6[12]/.test(x.id)), wB = worst(x => /^B[yzT]$/.test(x.id)), wW = worst(x => /^w[yz]$/.test(x.id)), wP = worst(x => /^PB/.test(x.id));
  let cards = '';
  if (wS) cards += card('Nośność przekroju', fmt(wS.util * 100, 0) + '%', sym(wS.n), wS);
  if (wB) cards += card('Wyboczenie', fmt(wB.util * 100, 0) + '%', `${sym(wB.n)} · N<sub>Ed</sub> = ${kN(wB.Ed)} kN`, wB);
  if (wI) cards += card('Interakcja N + M', fmt(wI.util * 100, 0) + '%', sym(wI.n.replace(/ – odcinek.*/, '')), wI);
  if (wW) cards += card('Przemieszczenie', `${fmt(wW.Ed, 1)} mm`, `≤ ${fmt(wW.Rd, 1)} mm (H/${fmt(wW.d.lim, 0)})`, wW);
  if (wP) cards += card('Podstawa', fmt(wP.util * 100, 0) + '%', sym(wP.n), wP);
  if (r.sec) cards += card('Przekrój', esc(r.sec.nazwa), `${esc(st.material.gatunek + st.material.podgatunek)} · ${fmt(r.sec.masa, 1)} kg/m · ${fmt(r.sec.masa * r.md.H / 1000, 0)} kg · ${r.exc ? r.exc.exc : ''}`, null);
  if (r.alphaMin) cards += card('Mnożnik α<sub>cr</sub>', fmt(Math.min(r.alphaMin.y, r.alphaMin.z), 2), `x–z: ${fmt(r.alphaMin.y, 2)} · x–y: ${fmt(r.alphaMin.z, 2)}`, c.find(x => x.id === 'acr'));
  let h = head(el, 'Podsumowanie') + `<div class="cards">${cards}</div>`;
  const msgs = [...r.errors.map(e => `<div class="msg err">${esc(e)}</div>`), ...r.warnings.map(e => `<div class="msg wrn">${esc(e)}</div>`), ...r.info.map(e => `<div class="msg">${esc(e)}</div>`)];
  if (msgs.length) h += `<div class="msgs">${msgs.join('')}</div>`;
  const nF = c.filter(x => x.status === 'fail' && !x.info);
  if (nF.length) h += `<div class="failnav">Niespełnione warunki: ${c.map((x, i) => x.status === 'fail' && !x.info ? `<button class="goto" data-goto="${i}" type="button">${sym(x.n)}</button>` : '').join('')}</div>`;
  const isOk = (x) => x.info || x.status === 'ok', nOk = c.filter(isOk).length;
  h += `<div class="tickbar"><span>Spełnione: <b>${nOk}</b> z ${c.length}</span><span class="hint">Znaczniki ✓ ustawiane automatycznie przy każdej zmianie danych. Kliknij punkt normy – objaśnienie; kliknij warunek – jak obliczono (wzór, podstawienie, wynik).</span></div>`;
  h += `<div class="tscroll"><table class="ctab"><thead><tr><th class="tk">✓</th><th>Sprawdzenie</th><th>Punkt normy</th><th style="text-align:right">Warunek</th><th>Wykorzystanie</th><th>Status</th><th></th></tr></thead><tbody>`;
  let grp = '';
  c.forEach((x, i) => {
    if (x.grp !== grp) { grp = x.grp; h += `<tr class="g"><td colspan="7">${esc(grp)}</td></tr>`; }
    const on = isOk(x);
    const u = x.util !== null && isFinite(x.util) ? x.util : (x.status === 'fail' ? Infinity : 0);
    const bw = Math.min(100, (isFinite(u) ? u : 1) * 100);
    h += `<tr class="${on ? 'done' : ''}" data-ci="${i}"><td class="tk"><input type="checkbox" data-tick="${i}" ${on ? 'checked' : ''} tabindex="-1" aria-readonly="true"></td><td>${sym(x.n)}${x.combo ? `<br><small class="hint">${esc(x.combo)}</small>` : ''}</td><td><button class="nref lnk" data-ref="${i}" type="button">${esc(x.ref)}</button></td><td class="val" style="text-align:right">${x.unit === '-' ? (x.info ? fmt(x.Rd, 2) : fmt(x.util, 3) + ' ≤ 1') : `${unitV(x.Ed, x.unit)} ${u <= 1 ? '≤' : '>'} ${unitV(x.Rd, x.unit)}`}</td><td class="bar"><span style="display:inline-block;width:90px;height:8px;border-radius:4px;background:var(--line2);vertical-align:middle;margin-right:6px;overflow:hidden"><span style="display:block;height:100%;width:${bw}%;background:var(--${x.info ? 'info' : u > 1 ? 'fail' : u > 0.9 ? 'warn' : 'ok'})"></span></span><b>${isFinite(u) ? fmt(u * 100, 0) + '%' : '∞'}</b></td><td>${stc(x)}</td><td class="go"><button class="gobtn" data-gom="${i}" type="button" title="Przejdź do danych / wyników, od których zależy ten warunek">pokaż →</button></td></tr>`;
  });
  h += '</tbody></table></div>';
  el.innerHTML = h; bindHead(el); bindChecks(el);
  $$('[data-tick]', el).forEach(cb => cb.addEventListener('click', ev => ev.preventDefault()));
  $$('[data-goto]', el).forEach(b => b.addEventListener('click', () => A.explainPopup(c[+b.dataset.goto])));
  $$('[data-gom]', el).forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); A.gotoCheck(c[+b.dataset.gom]); }));
  $$('[data-gck]', el).forEach(d => d.addEventListener('click', () => { const x = c.find(q => q.id === d.dataset.gck); if (x) A.explainPopup(x); }));
};

/* ================================================================ RAPORT */
/* raport: pełny / statyka / własny (edytowalny, zapisywany w projekcie); druk w oknie programu (nagłówek/stopka stron przez tabelę .pwrap) */
const wrapPrint = (html) => `<table class="pwrap"><thead><tr><td><div class="psp"></div></td></tr></thead><tfoot><tr><td><div class="psp"></div></td></tr></tfoot><tbody><tr><td class="pbody">${html}</td></tr></tbody></table>`;

function cleanHTML(html) {

const printNow = () => { A.selectTab('report'); setTimeout(() => window.print(), 80); };

  const bindSeg = () => {

  bindSeg();
  $('#rHtml', el).onclick = () => V.exportHTML(); $('#rOdt', el).onclick = () => V.exportODT(); $('#rPrint', el).onclick = printNow;
};
let ownT = 0;
const OWN_ON = 'Raport własny – zapisywany w projekcie przy każdej zmianie; nie zmienia się po zmianie danych (aktualne obliczenia: „Wstaw raport pełny” / „Wstaw statykę”).';
function renderOwn(el, seg) {
  const own = S().meta.ownOn === true;
  if (!own && !repOk()) { el.innerHTML = `<div class="rtools">${seg}</div>` + errBox(); return; }
  const B = (cmd, lab, tit, val) => `<button data-oc="${cmd}"${val ? ` data-ov="${val}"` : ''} title="${tit}" type="button">${lab}</button>`;
  el.innerHTML = `<div class="rtools">${seg}<span class="sp" style="flex:1"></span><button class="btn" id="oExp" type="button">Zapisz HTML…</button><button class="btn" id="oOdt" type="button" title="OpenDocument Text – LibreOffice Writer, MS Word">Zapisz .odt…</button><button class="btn pri" id="oPrint" type="button">Drukuj / PDF</button></div><div class="rtools owntools">
      <span class="grp">${B('bold', '<b>B</b>', 'Pogrubienie (Ctrl+B)')}${B('italic', '<i>I</i>', 'Kursywa (Ctrl+I)')}${B('underline', '<u>U</u>', 'Podkreślenie (Ctrl+U)')}${B('removeFormat', 'T̸', 'Usuń formatowanie zaznaczenia')}</span>
      <span class="grp">${B('formatBlock', 'H1', 'Tytuł', 'h1')}${B('formatBlock', 'H2', 'Nagłówek rozdziału', 'h2')}${B('formatBlock', 'H3', 'Podtytuł', 'h3')}${B('formatBlock', '¶', 'Zwykły akapit', 'p')}${B('insertUnorderedList', '•', 'Lista punktowana')}${B('insertOrderedList', '1.', 'Lista numerowana')}</span>

      <button class="btn sm" id="oInsS" type="button" title="Wstawia raport statyki (aktualne dane) za akapitem z kursorem">Wstaw statykę</button>

      <button class="btn sm" id="oReset" type="button" ${own ? '' : 'disabled'} title="Usuwa własne zmiany – raport własny znowu pokazuje bieżący raport obliczeń">Przywróć raport obliczeń</button>
      <button class="btn sm" id="oClr" type="button" title="Usuwa całą treść raportu własnego">Wyczyść</button></div>
    <p class="ownstate" id="oState">${own ? OWN_ON : 'Podgląd bieżącego raportu obliczeń – kliknij w tekst i pisz albo usuwaj (zaznacz i Delete); po pierwszej zmianie raport staje się Twoją kopią zapisywaną w projekcie.'}</p>
    <div class="ownwrap">${wrapPrint(`<div id="ownrep" contenteditable="true" spellcheck="true" lang="pl">${own ? cleanHTML(S().meta.own || '') : repBuild('full')}</div>`)}</div>`;
  const ed = $('#ownrep', el), st = $('#oState', el);
  const save = () => { clearTimeout(ownT); ownT = setTimeout(() => { S().meta.own = ed.innerHTML; S().meta.ownOn = true; A.markDirty(); st.textContent = OWN_ON; const rb = $('#oReset', el); if (rb) rb.disabled = false; }, 350); };
  ed.addEventListener('input', save);
  ed.addEventListener('focus', () => { try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) { /* */ } });
  $$('[data-oc]', el).forEach(b => { b.addEventListener('mousedown', ev => ev.preventDefault()); b.addEventListener('click', () => { ed.focus(); try { document.execCommand(b.dataset.oc, false, b.dataset.ov ? `<${b.dataset.ov}>` : null); } catch (e) { /* */ } save(); }); });
  const insertAtCaret = (html) => {
    const sel = window.getSelection(), inEd = sel && sel.rangeCount && ed.contains(sel.getRangeAt(0).commonAncestorContainer);
    const t = document.createElement('template'); t.innerHTML = html; const frag = t.content;
    const isBlock = [...frag.childNodes].some(n => n.nodeType === 1 && /^(h[1-6]|div|table|p|ul|ol)$/i.test(n.tagName) && !(frag.childNodes.length === 1 && /^p$/i.test(n.tagName)));
    if (inEd && isBlock) { let top = sel.getRangeAt(0).startContainer; while (top && top.parentNode !== ed) top = top.parentNode; if (top && top !== ed) { const empty = top.nodeType === 1 ? !top.textContent.trim() && !top.querySelector('svg, img, table') : !top.nodeValue.trim(); ed.insertBefore(frag, top.nextSibling); if (empty) top.remove(); } else ed.appendChild(frag); }
    else if (inEd) { const rg = sel.getRangeAt(0); rg.deleteContents(); rg.insertNode(frag); rg.collapse(false); } else ed.appendChild(frag);
    save();
  };
  const insRep = (kind) => { if (!repOk()) { Q.toast('Usuń błędy danych – raport obliczeń jest niedostępny.'); return; } insertAtCaret(repBuild(kind)); Q.toast(kind === 'stat' ? 'Wstawiono raport statyki.' : 'Wstawiono raport obliczeń.', 1800); };
  const sumTable = () => { const r = R(); if (!repOk()) return ''; return `<h2>Zestawienie wyników</h2><table class="rtab"><thead><tr><th>Sprawdzenie</th><th>Punkt normy</th><th>Wykorzystanie</th><th>Status</th></tr></thead><tbody>${r.checks.map(c => `<tr><td>${sym(c.n)}</td><td>${esc(c.ref || '')}</td><td>${c.util !== null && isFinite(c.util) ? fmt(c.util * 100, 0) + '%' : '—'}</td><td>${c.info ? 'informacja' : c.status === 'fail' ? 'niespełniony' : c.status === 'warn' ? 'uwaga' : 'spełniony'}</td></tr>`).join('')}</tbody></table>`; };
  $('#oIns', el).onclick = () => insRep('full'); $('#oInsS', el).onclick = () => insRep('stat');
  $('#oSum', el).onclick = () => { const h = sumTable(); if (h) insertAtCaret(h); else Q.toast('Brak wyników.'); };
  $('#oDate', el).onclick = () => insertAtCaret(`<p>${esc(S().meta.nazwa || '')} – ${new Date().toLocaleDateString('pl-PL')}</p>`);
  const rerender = () => { renderOwn(el, seg); $$('[data-rm]', el).forEach(b => b.addEventListener('click', () => { S().meta.repMode = b.dataset.rm; A.markDirty(); V.report(el); })); };

}
function ownHTML() { const ed = $('#ownrep'); return ed ? ed.innerHTML : (S().meta.ownOn ? cleanHTML(S().meta.own || '') : (repOk() ? repBuild('full') : '')); }

  return `<!doctype html><html lang="pl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title || 'Raport – ' + st.meta.nazwa)}</title><style>${css}\nhtml,body{height:auto}body{overflow:auto;padding:20px 16px;background:#fff}.rtools{margin-bottom:14px}@media print{body{padding:0}.rtools{display:none}}</style></head><body>` +
    `<div class="rtools"><button class="btn pri" onclick="window.print()">Drukuj / zapisz PDF</button><span class="hint">Plik zawiera dane projektu – można go otworzyć w programie SłupStal (Otwórz).</span></div><div id="report">${wrapPrint(body)}</div><script type="application/json" id="slupstal-data">${data}<\/script></body></html>`;

async function saveText(name, content, filter) {
